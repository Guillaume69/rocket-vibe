# The licence notice of the crates the WhatsApp engine (crates/rv-whatsapp/engine,
# on whatsapp-rust) links into the desktop app, per platform:
# rv-whatsapp-licenses-{linux,windows,macos}.txt in the rv-whatsapp-licenses
# artifact. Called by desktop.yml when it packages.
name: desktop-whatsapp

on:
  workflow_call:
  push:
    branches: ['**']
    paths:
      - 'crates/rv-whatsapp/**'
      - 'crates/rv-signal/**'
      - 'crates/rv-link-preview/**'
      - 'crates/rv-protocol/**'
      - '.github/workflows/desktop-whatsapp.yml'
  pull_request:
    paths:
      - 'crates/rv-whatsapp/**'
      - 'crates/rv-signal/**'
      - 'crates/rv-link-preview/**'
      - 'crates/rv-protocol/**'
      - '.github/workflows/desktop-whatsapp.yml'
  workflow_dispatch:

# Called, github.workflow is the caller's: its own group, never cancelled by
# (nor cancelling) a standalone run of this workflow.
concurrency:
  group: whatsapp-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  licenses:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/rv-whatsapp
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Notices
        run: |
          mkdir -p out
          bash engine/licenses.sh x86_64-unknown-linux-gnu > out/rv-whatsapp-licenses-linux.txt
          bash engine/licenses.sh x86_64-pc-windows-gnu > out/rv-whatsapp-licenses-windows.txt
          bash engine/licenses.sh aarch64-apple-darwin > out/rv-whatsapp-licenses-macos.txt
          grep -q "whatsapp-rust" out/rv-whatsapp-licenses-linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rv-whatsapp-licenses
          path: crates/rv-whatsapp/out/*
