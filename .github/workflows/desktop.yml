name: desktop

on:
  push:
    branches: [master]
    tags: ['desktop-v*']
    paths:
      - 'apps/desktop/**'
      - 'scripts/version.mjs'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/version.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            version=$(node scripts/version.mjs desktop --tag "${{ github.ref_name }}")
          else
            version=$(node scripts/version.mjs desktop)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The same Fedora as scripts/build.sh: GTK 4 and libadwaita recent enough
  # for the features the app asks for, which Ubuntu 24.04 does not ship.
  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:44
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Toolchain and libraries
        working-directory: /
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar rust cargo clippy rustfmt gcc pkgconf-pkg-config
          gtk4-devel libadwaita-devel gstreamer1-devel gstreamer1-plugins-base-devel
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/target
          key: desktop-linux-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-linux-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p rocket-vibe-gtk
      - name: Package
        run: |
          name="rocket-vibe-desktop-${{ needs.version.outputs.version }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/rocket-vibe-gtk data/me.barrut.RocketVibe.desktop README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: apps/desktop/dist/*.tar.gz

  windows:
    needs: version
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
        working-directory: apps/desktop
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: apps/desktop/target
          key: desktop-windows-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-windows-
      - run: cargo test --locked -p rv-core
      - run: cargo build --locked --release -p rocket-vibe-gtk
      - run: scripts/package-windows.sh "${{ needs.version.outputs.version }}"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress | Out-Null
          $version = "${{ needs.version.outputs.version }}"
          $package = Resolve-Path "dist/rocket-vibe-desktop-$version-windows-x86_64"
          $out = Resolve-Path dist
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DSourceDir=$package" "/O$out" data/windows/rocket-vibe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Installs, starts the app from a link, uninstalls: the zip's DLLs and
      # the link registration are only proven on a real Windows.
      - name: Installer round trip
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\rocket-vibe"
          $exe = "$app\bin\rocket-vibe-gtk.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\rocket-vibe\rocket-vibe.lnk")) { throw "no Start menu shortcut" }
          $command = (Get-ItemProperty "HKCU:\Software\Classes\rocketvibe\shell\open\command").'(default)'
          if ($command -notlike "*rocket-vibe-gtk.exe*%1*") { throw "rocketvibe:// is not registered: $command" }
          # Started as from the Start menu: no standard streams. On an early
          # exit, again with them captured, to say why.
          $run = Start-Process $exe -ArgumentList "rocketvibe://salon/smoke" -WorkingDirectory "$app\bin" -PassThru
          Start-Sleep -Seconds 10
          if ($run.HasExited) {
            $env:RUST_BACKTRACE = "1"
            $again = Start-Process $exe -ArgumentList "rocketvibe://salon/smoke" -WorkingDirectory "$app\bin" -PassThru `
              -RedirectStandardError "$env:RUNNER_TEMP\app-stderr.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\app-stdout.txt"
            Start-Sleep -Seconds 10
            if (-not $again.HasExited) { Stop-Process -Id $again.Id -Force }
            Get-Content "$env:RUNNER_TEMP\app-stderr.txt", "$env:RUNNER_TEMP\app-stdout.txt" -ErrorAction SilentlyContinue
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; Id = 1000 } -MaxEvents 1 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Message }
            throw "the app exited at start with code $($run.ExitCode)"
          }
          $log = "$env:LOCALAPPDATA\rocket-vibe-rs\rocket-vibe.log"
          if (-not (Test-Path $log)) { throw "no log file at ${log}, standard error was not redirected" }
          Get-Content $log -Tail 20
          Stop-Process -Id $run.Id -Force
          Start-Sleep -Seconds 2
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "HKCU:\Software\Classes\rocketvibe") { throw "the link registration outlived the uninstall" }
          if (Test-Path $exe) { throw "the app outlived the uninstall" }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-windows
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*-setup.exe

  macos:
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - run: brew install gtk4 libadwaita gstreamer pkgconf
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/target
          key: desktop-macos-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-macos-
      - run: cargo test --locked -p rv-core
      - run: cargo build --locked --release -p rocket-vibe-gtk
      - name: Package
        run: |
          name="rocket-vibe-desktop-${{ needs.version.outputs.version }}-macos-arm64"
          mkdir -p "dist/$name"
          cp target/release/rocket-vibe-gtk README.md "dist/$name/"
          printf 'Needs Homebrew: brew install gtk4 libadwaita gstreamer\n' > "dist/$name/REQUIREMENTS.txt"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/dist/*.tar.gz

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Desktop ${{ needs.version.outputs.version }}
          files: |
            *.tar.gz
            *.zip
            *-setup.exe
