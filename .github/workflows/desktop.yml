name: desktop

on:
  push:
    branches: [master]
    tags: ['desktop-v*']
    paths:
      - 'apps/desktop/**'
      - 'scripts/version.mjs'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'scripts/version.mjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PACKAGE: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            version=$(node scripts/version.mjs desktop --tag "${{ github.ref_name }}")
            node scripts/changelog.mjs desktop "$version" > /dev/null
          else
            version=$(node scripts/version.mjs desktop)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The same Fedora as scripts/build.sh: GTK 4 and libadwaita recent enough
  # for the features the app asks for, which Ubuntu 24.04 does not ship.
  linux:
    needs: version
    runs-on: ubuntu-24.04
    container: fedora:44
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Toolchain and libraries
        working-directory: /
        run: >
          dnf install -y --setopt=install_weak_deps=False
          git tar rust cargo clippy rustfmt gcc pkgconf-pkg-config
          gtk4-devel libadwaita-devel webkitgtk6.0-devel gstreamer1-devel gstreamer1-plugins-base-devel
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/target
          key: desktop-linux-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-linux-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p rocket-vibe-gtk
        if: env.PACKAGE == 'true'
      - name: Package
        if: env.PACKAGE == 'true'
        run: |
          name="rocket-vibe-desktop-${{ needs.version.outputs.version }}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/rocket-vibe-gtk data/com.rocketvibe.app.desktop README.md "dist/$name/"
          cp -R data/icons "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        if: env.PACKAGE == 'true'
        with:
          name: desktop-linux
          path: apps/desktop/dist/*.tar.gz

  # Built on Arch against Arch's libraries, glibc included, so it runs on any
  # distribution: see scripts/appimage-build.sh.
  appimage:
    needs: version
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: ghcr.io/pkgforge-dev/archlinux:latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/target/appimage
          key: desktop-appimage-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-appimage-
      - run: sh scripts/appimage-build.sh "${{ needs.version.outputs.version }}" dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-appimage
          path: apps/desktop/dist/*.AppImage

  # The AppImage on a distribution with no GTK at all: sample messages drawn,
  # and the app still running after a while.
  appimage-smoke:
    needs: appimage
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-appimage
      - uses: actions/checkout@v5
        with:
          path: repo
          sparse-checkout: apps/desktop/tests/media
      - name: Gallery on Ubuntu 22.04
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq xvfb x11-apps imagemagick ca-certificates > /dev/null
          if ldconfig -p | grep -q 'libgtk-4\|libadwaita'; then echo "::error::GTK is on this system"; exit 1; fi
          chmod +x ./*.AppImage
          Xvfb :99 -screen 0 1100x750x24 > /dev/null 2>&1 &
          export DISPLAY=:99 HOME="$RUNNER_TEMP/home" RV_SMOKE_GALLERY=1
          media="$PWD/repo/apps/desktop/tests/media"
          export RV_SMOKE_MEDIA="$media/voice.ogg|$media/voice.m4a|$media/video.mp4"
          mkdir -p "$HOME"
          sleep 2
          ./*.AppImage > gallery.log 2>&1 &
          app=$!
          sleep 25
          xwd -root -silent | convert xwd:- gallery.png
          cat gallery.log
          if ! kill -0 "$app" 2> /dev/null; then echo "::error::the AppImage exited"; exit 1; fi
          if grep -q panicked gallery.log; then echo "::error::a panic was logged"; exit 1; fi
          if [ "$(grep -c "smoke: media .* ok" gallery.log)" != 3 ]; then echo "::error::audio or video did not play"; exit 1; fi
          kill "$app"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: appimage-screenshots
          path: gallery.png

  windows:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: version
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
        working-directory: apps/desktop
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip
            mingw-w64-ucrt-x86_64-rust
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: apps/desktop/target
          key: desktop-windows-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-windows-
      - run: cargo test --locked -p rv-core
      - run: cargo build --locked --release -p rocket-vibe-gtk
      - run: scripts/package-windows.sh "${{ needs.version.outputs.version }}"
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress | Out-Null
          $version = "${{ needs.version.outputs.version }}"
          $package = Resolve-Path "dist/rocket-vibe-desktop-$version-windows-x86_64"
          $out = Resolve-Path dist
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$version" "/DSourceDir=$package" "/O$out" data/windows/rocket-vibe.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Installs, starts the app from a link, uninstalls: the zip's DLLs and
      # the link registration are only proven on a real Windows.
      - name: Installer round trip
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
          $app = "$env:LOCALAPPDATA\Programs\rocket-vibe"
          $exe = "$app\bin\rocket-vibe-gtk.exe"
          if (-not (Test-Path $exe)) { throw "not installed at $exe" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\rocket-vibe\rocket-vibe.lnk")) { throw "no Start menu shortcut" }
          $command = (Get-ItemProperty "HKCU:\Software\Classes\rocketvibe\shell\open\command").'(default)'
          if ($command -notlike "*rocket-vibe-gtk.exe*%1*") { throw "rocketvibe:// is not registered: $command" }
          # A crash leaves a minidump for the diagnosis below.
          $dumps = "$env:RUNNER_TEMP\dumps"
          New-Item -ItemType Directory -Force $dumps | Out-Null
          $wer = "HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\rocket-vibe-gtk.exe"
          New-Item -Force $wer | Out-Null
          Set-ItemProperty $wer DumpFolder $dumps
          Set-ItemProperty $wer DumpType 1 -Type DWord
          # Started without redirection, as a user would. On an early exit,
          # again with the streams captured, to say why.
          $run = Start-Process $exe -ArgumentList "rocketvibe://room/smoke" -WorkingDirectory "$app\bin" -PassThru
          Start-Sleep -Seconds 10
          if ($run.HasExited) {
            Write-Output "== exit code $($run.ExitCode); its log:"
            Get-Content "$env:LOCALAPPDATA\rocket-vibe-rs\rocket-vibe.log" -ErrorAction SilentlyContinue
            Write-Output "== crash report:"
            Get-WinEvent -FilterHashtable @{ LogName = "Application"; Id = 1000 } -MaxEvents 1 -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Message }
            $cdb = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe" -ErrorAction SilentlyContinue
            $dump = Get-ChildItem "$dumps\*.dmp" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($cdb -and $dump) {
              Write-Output "== crash stack:"
              & $cdb.FullName -z $dump.FullName -c ".ecxr; kb 40; q" 2>&1 | Select-String -Pattern "^[0-9a-f]{2} |ExceptionCode|ucrtbase|^ChildEBP|RetAddr"
            } else { Write-Output "== no debugger ($cdb) or no dump ($dump)" }
            $again = Start-Process $exe -ArgumentList "rocketvibe://room/smoke" -WorkingDirectory "$app\bin" -PassThru `
              -RedirectStandardError "$env:RUNNER_TEMP\app-stderr.txt" -RedirectStandardOutput "$env:RUNNER_TEMP\app-stdout.txt"
            Start-Sleep -Seconds 10
            Write-Output "== relaunched with captured streams: exited $($again.HasExited); its stderr:"
            if (-not $again.HasExited) { Stop-Process -Id $again.Id -Force }
            Get-Content "$env:RUNNER_TEMP\app-stderr.txt" -ErrorAction SilentlyContinue
            throw "the app exited at start with code $($run.ExitCode)"
          }
          Get-Content "$env:LOCALAPPDATA\rocket-vibe-rs\rocket-vibe.log" -Tail 20 -ErrorAction SilentlyContinue
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $shot.Save("$env:RUNNER_TEMP\screenshot.png")
          Stop-Process -Id $run.Id -Force
          Start-Sleep -Seconds 2
          # Started in the background: running, in the notification area, no window;
          # a second launch hands the running app its link and brings the window back.
          $bg = Start-Process $exe -ArgumentList "--background" -WorkingDirectory "$app\bin" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\background-out.txt"
          Start-Sleep -Seconds 8
          $bg.Refresh()
          if ($bg.HasExited) { throw "a background start left (exit $($bg.ExitCode))" }
          if ($bg.MainWindowHandle -ne 0) { throw "a background start showed the window" }
          $second = Start-Process $exe -ArgumentList "rocketvibe://room/smoke" -WorkingDirectory "$app\bin" -PassThru
          Start-Sleep -Seconds 6
          if (-not $second.HasExited) { Stop-Process -Id $second.Id -Force; throw "a second launch kept running beside the first" }
          $bg.Refresh()
          $shown = $bg.MainWindowHandle -ne 0
          Stop-Process -Id $bg.Id -Force
          Start-Sleep -Seconds 2
          Get-Content "$env:RUNNER_TEMP\background-out.txt" -ErrorAction SilentlyContinue
          if (-not $shown) { throw "the second launch did not bring the window back" }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\background-out.txt" -Pattern "native: tray icon added" -Quiet)) { throw "no notification-area icon" }
          # Start at login: the Run value is written, taken away, written again for the uninstaller.
          $runKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          foreach ($state in "on", "off", "on") {
            $env:RV_SMOKE_AUTOSTART = $state
            $switch = Start-Process $exe -WorkingDirectory "$app\bin" -PassThru -Wait -RedirectStandardOutput "$env:RUNNER_TEMP\autostart.txt"
            Get-Content "$env:RUNNER_TEMP\autostart.txt" -ErrorAction SilentlyContinue
            $login = (Get-ItemProperty $runKey -ErrorAction SilentlyContinue).'rocket-vibe'
            if ($switch.ExitCode -ne 0) { throw "start at login not switched $state" }
            if ($state -eq "on" -and $login -notlike "*rocket-vibe-gtk.exe*--background") { throw "start at login not written: $login" }
            if ($state -eq "off" -and $login) { throw "start at login not taken away: $login" }
          }
          Remove-Item Env:RV_SMOKE_AUTOSTART
          # Sample messages without a server: how text, emoji and times line up here.
          $env:RV_SMOKE_GALLERY = "1"
          $media = "$env:GITHUB_WORKSPACE\apps\desktop\tests\media"
          $env:RV_SMOKE_MEDIA = "$media\voice.ogg|$media\voice.m4a|$media\video.mp4"
          $gallery = Start-Process $exe -WorkingDirectory "$app\bin" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\gallery-out.txt"
          Start-Sleep -Seconds 8
          for ($i = 0; $i -lt 20 -and @(Select-String -Path "$env:RUNNER_TEMP\gallery-out.txt" -Pattern "smoke: media " -ErrorAction SilentlyContinue).Count -lt 3; $i++) { Start-Sleep -Seconds 1 }
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $shot.Save("$env:RUNNER_TEMP\gallery.png")
          if (-not $gallery.HasExited) { Stop-Process -Id $gallery.Id -Force }
          Get-Content "$env:RUNNER_TEMP\gallery-out.txt" -ErrorAction SilentlyContinue
          Remove-Item Env:RV_SMOKE_MEDIA
          $played = @(Select-String -Path "$env:RUNNER_TEMP\gallery-out.txt" -Pattern "smoke: media .* ok").Count
          if ($played -ne 3) { throw "audio or video did not play ($played of 3)" }
          # Keyboard layout changes with the composer focused: once as GTK leaves it, to show the
          # test reproduces the IME crash, then with the input method pinned, which must stay clean.
          foreach ($mode in @("unpinned", "1")) {
            $env:RV_SMOKE_IME = $mode
            $ime = Start-Process $exe -WorkingDirectory "$app\bin" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\ime-$mode.txt"
            Start-Sleep -Seconds 12
            $imeAlive = -not $ime.HasExited
            if ($imeAlive) { Stop-Process -Id $ime.Id -Force }
            Start-Sleep -Seconds 1
            $imeLog = Get-Content "$env:LOCALAPPDATA\rocket-vibe-rs\rocket-vibe.log" -Raw -ErrorAction SilentlyContinue
            $criticals = ([regex]::Matches("$imeLog", "GTK_IS_IM_CONTEXT_IME")).Count
            Get-Content "$env:RUNNER_TEMP\ime-$mode.txt" -ErrorAction SilentlyContinue
            Write-Host "input method $mode : alive $imeAlive, $criticals IME criticals"
            if ($mode -eq "1" -and (-not $imeAlive -or $criticals -gt 0)) { throw "a keyboard layout change still breaks the input method" }
          }
          Remove-Item Env:RV_SMOKE_IME
          # The call window: WebView2 in a window of the app, on the page it was given.
          $env:RV_SMOKE_CALL = "https://example.org/"
          $call = Start-Process $exe -WorkingDirectory "$app\bin" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\call-out.txt"
          Start-Sleep -Seconds 15
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $shot.Save("$env:RUNNER_TEMP\call.png")
          if (-not $call.HasExited) { Stop-Process -Id $call.Id -Force }
          Remove-Item Env:RV_SMOKE_CALL
          Get-Content "$env:RUNNER_TEMP\call-out.txt" -ErrorAction SilentlyContinue
          if (-not (Select-String -Path "$env:RUNNER_TEMP\call-out.txt" -Pattern "native: call loaded https://example.org" -Quiet)) {
            Get-Content "$env:LOCALAPPDATA\rocket-vibe-rs\rocket-vibe.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "the call window did not load its page"
          }
          # The inline player: WebView2 laid over a frame of the list, on the embed page.
          $env:RV_SMOKE_PLAYER = "YouTube:aqz-KE-bpKQ"
          $player = Start-Process $exe -WorkingDirectory "$app\bin" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\player-out.txt"
          Start-Sleep -Seconds 20
          $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($shot).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $shot.Save("$env:RUNNER_TEMP\player.png")
          if (-not $player.HasExited) { Stop-Process -Id $player.Id -Force }
          Remove-Item Env:RV_SMOKE_PLAYER
          Get-Content "$env:RUNNER_TEMP\player-out.txt" -ErrorAction SilentlyContinue
          if (-not (Select-String -Path "$env:RUNNER_TEMP\player-out.txt" -Pattern "native: player loaded https://player.rocket-vibe.invalid/" -Quiet)) {
            Get-Content "$env:LOCALAPPDATA\rocket-vibe-rs\rocket-vibe.log" -Tail 40 -ErrorAction SilentlyContinue
            throw "the player did not load its page"
          }
          # Soak: rows, toasts and the badge churned for 45 s; the app must still be there, with no panic recorded.
          $env:RV_SMOKE_SOAK = "45"
          $soak = Start-Process $exe -WorkingDirectory "$app\bin" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\soak-out.txt"
          Start-Sleep -Seconds 55
          $survived = Select-String -Path "$env:RUNNER_TEMP\soak-out.txt" -Pattern "soak survived" -Quiet
          Get-Content "$env:RUNNER_TEMP\soak-out.txt" -ErrorAction SilentlyContinue
          if ($soak.HasExited) { throw "the app died during the soak (exit $($soak.ExitCode))" }
          Stop-Process -Id $soak.Id -Force
          Remove-Item Env:RV_SMOKE_SOAK, Env:RV_SMOKE_GALLERY
          if (-not $survived) { throw "the soak did not finish" }
          if (Test-Path "$env:LOCALAPPDATA\rocket-vibe-rs\crash.log") { Get-Content "$env:LOCALAPPDATA\rocket-vibe-rs\crash.log"; throw "a panic was recorded" }
          Start-Sleep -Seconds 2
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path "HKCU:\Software\Classes\rocketvibe") { throw "the link registration outlived the uninstall" }
          if (Test-Path $exe) { throw "the app outlived the uninstall" }
          if ((Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -ErrorAction SilentlyContinue).'rocket-vibe') { throw "start at login outlived the uninstall" }
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-windows-screenshot
          path: |
            ${{ runner.temp }}/screenshot.png
            ${{ runner.temp }}/gallery.png
            ${{ runner.temp }}/call.png
            ${{ runner.temp }}/player.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: desktop-windows-crash
          path: ${{ runner.temp }}/dumps
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-windows
          path: |
            apps/desktop/dist/*.zip
            apps/desktop/dist/*-setup.exe

  macos:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: version
    runs-on: macos-15
    defaults:
      run:
        working-directory: apps/desktop
    env:
      APPLE_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      APPLE_NOTARY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install gtk4 libadwaita gstreamer adwaita-icon-theme pkgconf dylibbundler
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/target
          key: desktop-macos-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: desktop-macos-
      - run: cargo test --locked -p rv-core
      - run: cargo build --locked --release -p rocket-vibe-gtk
      - name: Developer ID certificate
        if: env.APPLE_SIGNING == 'true'
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d '" ')"); done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          if [ -z "$identity" ]; then echo "::error::no Developer ID Application identity in the certificate"; exit 1; fi
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - run: scripts/package-macos.sh "${{ needs.version.outputs.version }}"
      # Apple's notary checks the signed DMG; the ticket stapled to it lets
      # the app open offline without any prompt.
      - name: Notarization
        if: env.APPLE_SIGNING == 'true' && env.APPLE_NOTARY == 'true'
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          printf '%s' "$API_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait --timeout 60m \
            --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          field() { python3 -c 'import json,sys
          try: print(json.load(open(sys.argv[1])).get(sys.argv[2], ""))
          except ValueError: print("")' "$RUNNER_TEMP/notary.json" "$1"; }
          id=$(field id)
          status=$(field status)
          if [ "$status" != Accepted ]; then
            if [ -z "$status" ]; then
              echo "::error::Apple has not finished notarizing submission $id yet: run the job again later"
            else
              xcrun notarytool log "$id" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID"
              echo "::error::notarization: $status"
            fi
            exit 1
          fi
          xcrun stapler staple "$dmg"
          rm "$RUNNER_TEMP/notary.p8"
      - name: What Gatekeeper will say
        if: env.APPLE_SIGNING == 'true'
        run: |
          codesign -dv --verbose=2 dist/rocket-vibe.app 2>&1 | grep -E "Authority|TeamIdentifier|Runtime|flags"
          spctl --assess --type execute -vv dist/rocket-vibe.app
          if [ "$APPLE_NOTARY" = true ]; then
            spctl --assess --type open --context context:primary-signature -vv dist/*.dmg
            xcrun stapler validate dist/*.dmg
          fi
      # Homebrew moved aside: a library the bundle still took from it fails here.
      - name: The bundle starts on its own
        run: |
          sudo mv /opt/homebrew /opt/homebrew-aside
          app="$PWD/dist/rocket-vibe.app"
          "$app/Contents/MacOS/rocket-vibe-gtk" rocketvibe://room/smoke > "$RUNNER_TEMP/app.log" 2>&1 &
          pid=$!
          sleep 10
          alive=0
          if kill -0 "$pid" 2>/dev/null; then alive=1; fi
          screencapture -x "$RUNNER_TEMP/screenshot.png" || true
          kill "$pid" 2>/dev/null || true
          # Sample messages without a server: how text, emoji and times line up here.
          sleep 2
          media="$GITHUB_WORKSPACE/apps/desktop/tests/media"
          RV_SMOKE_GALLERY=1 RV_SMOKE_MEDIA="$media/voice.ogg|$media/voice.m4a|$media/video.mp4" \
            "$app/Contents/MacOS/rocket-vibe-gtk" > "$RUNNER_TEMP/gallery.log" 2>&1 &
          gallery=$!
          sleep 8
          screencapture -x "$RUNNER_TEMP/gallery.png" || true
          kill "$gallery" 2>/dev/null || true
          cat "$RUNNER_TEMP/gallery.log"
          if [ "$(grep -c "smoke: media .* ok" "$RUNNER_TEMP/gallery.log")" != 3 ]; then echo "::error::audio or video did not play"; alive=0; fi
          # The call window: WKWebView in a window of the app, on the page it was given.
          RV_SMOKE_GALLERY=1 RV_SMOKE_CALL=https://example.org/ "$app/Contents/MacOS/rocket-vibe-gtk" > "$RUNNER_TEMP/call.log" 2>&1 &
          call=$!
          sleep 15
          screencapture -x "$RUNNER_TEMP/call.png" || true
          kill "$call" 2>/dev/null || true
          cat "$RUNNER_TEMP/call.log"
          if ! grep -q "native: call loaded https://example.org" "$RUNNER_TEMP/call.log"; then echo "::error::the call window did not load its page"; alive=0; fi
          # The inline player: WKWebView laid over a frame of the list, on the embed page.
          RV_SMOKE_GALLERY=1 RV_SMOKE_PLAYER=YouTube:aqz-KE-bpKQ "$app/Contents/MacOS/rocket-vibe-gtk" > "$RUNNER_TEMP/player.log" 2>&1 &
          player=$!
          sleep 20
          screencapture -x "$RUNNER_TEMP/player.png" || true
          kill "$player" 2>/dev/null || true
          cat "$RUNNER_TEMP/player.log"
          if ! grep -q "native: player loaded https://player.rocket-vibe.invalid/" "$RUNNER_TEMP/player.log"; then echo "::error::the player did not load its page"; alive=0; fi
          # Soak: rows, toasts and the badge churned for 45 s; the app must still be there, with no panic recorded.
          RV_SMOKE_GALLERY=1 RV_SMOKE_SOAK=45 "$app/Contents/MacOS/rocket-vibe-gtk" > "$RUNNER_TEMP/soak.log" 2>&1 &
          soak=$!
          sleep 55
          soak_alive=0
          if kill -0 "$soak" 2>/dev/null; then soak_alive=1; fi
          kill "$soak" 2>/dev/null || true
          grep smoke "$RUNNER_TEMP/soak.log" || true
          crash="$HOME/.cache/rocket-vibe-rs/crash.log"
          if [ -f "$crash" ]; then cat "$crash"; alive=0; fi
          if [ "$soak_alive" = 0 ] || ! grep -q "soak survived" "$RUNNER_TEMP/soak.log"; then alive=0; fi
          # Start at login: the launch agent is written, then taken away.
          plist="$HOME/Library/LaunchAgents/com.rocketvibe.app.plist"
          RV_SMOKE_AUTOSTART=on "$app/Contents/MacOS/rocket-vibe-gtk" || alive=0
          if ! grep -q -- "--background" "$plist" || ! plutil -lint "$plist"; then echo "::error::no launch agent"; alive=0; fi
          RV_SMOKE_AUTOSTART=off "$app/Contents/MacOS/rocket-vibe-gtk" || alive=0
          if [ -f "$plist" ]; then echo "::error::the launch agent outlived its switch"; alive=0; fi
          # Started in the background: running, without its window.
          "$app/Contents/MacOS/rocket-vibe-gtk" --background > "$RUNNER_TEMP/background.log" 2>&1 &
          background=$!
          sleep 8
          if ! kill -0 "$background" 2>/dev/null || ! grep -q "started without the window" "$RUNNER_TEMP/background.log"; then
            cat "$RUNNER_TEMP/background.log"
            echo "::error::no background start"
            alive=0
          fi
          kill "$background" 2>/dev/null || true
          sudo mv /opt/homebrew-aside /opt/homebrew
          cat "$RUNNER_TEMP/app.log"
          if [ "$alive" = 0 ]; then
            for report in ~/Library/Logs/DiagnosticReports/*rocket*; do
              [ -f "$report" ] && head -120 "$report"
            done
            echo "::error::the app exited at start"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: desktop-macos-screenshot
          path: |
            ${{ runner.temp }}/screenshot.png
            ${{ runner.temp }}/gallery.png
            ${{ runner.temp }}/call.png
            ${{ runner.temp }}/player.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: apps/desktop/dist/*.dmg

  macos-swiftui:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/desktop-swiftui.yml
    secrets: inherit

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, appimage, appimage-smoke, windows, macos, macos-swiftui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/changelog.mjs desktop "${{ needs.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Desktop ${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            *.tar.gz
            *.AppImage
            *.zip
            *-setup.exe
            *.dmg
