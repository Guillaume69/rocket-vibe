name: mobile

on:
  push:
    branches: [master]
    tags: ['mobile-v*']
    paths:
      - 'apps/mobile/**'
      - 'crates/rv-crypto*/**'
      - 'crates/rv-protocol/**'
      - 'scripts/version.mjs'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'crates/rv-crypto*/**'
      - 'crates/rv-protocol/**'
      - 'scripts/version.mjs'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/mobile

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            version=$(node ../../scripts/version.mjs mobile --tag "${{ github.ref_name }}")
            node ../../scripts/changelog.mjs mobile "$version" > /dev/null
          else
            version=$(node ../../scripts/version.mjs mobile)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

  # expo prebuild + Gradle on the runner: a local build, never EAS.
  android:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - name: Room on the disk to save the build caches
        working-directory: /
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/mobile-crypto
          key: mobile-crypto-android-${{ hashFiles('crates/rv-crypto-mobile/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            mobile-crypto-android-${{ hashFiles('crates/rv-crypto-mobile/Cargo.lock') }}-
            mobile-crypto-android-
      - name: Android SDK pieces the RN 0.86 template requires
        working-directory: /
        run: >
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install
          "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" > /dev/null
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::The GOOGLE_SERVICES_JSON secret is missing: the Android build needs Firebase's google-services.json."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing: without the app's key, the APK would not install over the previous one."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RV_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: gradle-
      - name: ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache > /dev/null
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-android-${{ hashFiles('apps/mobile/package-lock.json') }}
          restore-keys: ccache-android-
      - run: npm ci
      - run: npx expo prebuild --platform android --clean
        env:
          CI: 1
      - run: ./gradlew assembleRelease --no-daemon --build-cache -PreactNativeArchitectures=arm64-v8a
        working-directory: apps/mobile/android
        env:
          RV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RV_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RV_KEY_ALIAS: rocket-vibe
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          # A fresh runner gives the NDK a new mtime, which would miss every entry.
          CCACHE_COMPILERCHECK: string:ndk-27.1.12297006
          CCACHE_MAXSIZE: 2G
      - run: ccache --show-stats
      - name: Signed with the app's key
        run: '"$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"'

      - run: cp android/app/build/outputs/apk/release/app-release.apk "rocket-vibe-mobile-${{ needs.check.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: apps/mobile/rocket-vibe-mobile-*.apk

  release:
    if: github.ref_type == 'tag'
    needs: [check, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/changelog.mjs mobile "${{ needs.check.outputs.version }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          name: mobile-android
      - uses: softprops/action-gh-release@v2
        with:
          name: Mobile ${{ needs.check.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          files: '*.apk'
