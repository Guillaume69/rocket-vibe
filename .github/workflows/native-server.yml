name: native-server

on:
  push:
    branches: ['**']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/server/**'
      - 'apps/web/dist/**'
      - 'crates/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/desktop/**'
      - 'docs/protocol/**'
      - 'docker/compose.vibez.yml'
      - 'docker/compose.native-pilot.yml'
      - 'docker/compose.native-security-pilot.yml'
      - 'scripts/*native*'
      - 'scripts/inventory-rocketchat.mjs'
      - '.github/workflows/native-server.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/server/**'
      - 'apps/web/dist/**'
      - 'crates/**'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/desktop/**'
      - 'docs/protocol/**'
      - 'docker/compose.native-pilot.yml'
      - 'docker/compose.native-security-pilot.yml'
      - 'scripts/*native*'
      - 'scripts/inventory-rocketchat.mjs'
      - '.github/workflows/native-server.yml'
  workflow_dispatch:

concurrency:
  group: native-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      clients: ${{ steps.changed.outputs.clients }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: changed
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Manual/unknown bases run every client. Only disconnected crypto and
          # documentation changes can skip the long installed-provider pilots.
          base="${PR_BASE:-$BEFORE}"
          if [[ ! "$base" =~ ^[a-f0-9]{40}$ ]] || [[ "$base" = 0000000000000000000000000000000000000000 ]]; then
            echo 'clients=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$base"; then
              echo 'clients=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          changed=$(mktemp)
          trap 'rm -f "$changed"' EXIT
          git diff --name-only "$base" HEAD -- > "$changed"
          clients=false
          if grep -Evq '^(crates/rv-crypto/|docs/.*\.md$|[^/]+\.md$)' "$changed"; then
            clients=true
          fi
          # Once another crate consumes the shared engine, its changes require
          # full regressions as well as the crypto matrix (including indirect users).
          # Match the exact private dependency, including renamed/table forms.
          # rv-crypto-public only verifies public proofs and consumes no vault.
          if grep -Eq '^crates/rv-crypto/' "$changed" && git grep -Eq '(^|[[:space:].])"?rv-crypto"?([[:space:]]*=|\])|package[[:space:]]*=[[:space:]]*"rv-crypto"' -- ':(glob)**/Cargo.toml'; then
            clients=true
          fi
          echo "clients=$clients" >> "$GITHUB_OUTPUT"

  native-crypto:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    # Windows runs the whole suite in about 15 minutes before the protected smoke build.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/rv-crypto -> ../../target/native-crypto
            crates/rv-crypto-mobile -> ../../target/native-crypto
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --manifest-path crates/rv-crypto/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/rv-crypto/Cargo.toml --features system-keystore,native-http --target-dir target/native-crypto --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --locked --manifest-path crates/rv-crypto/Cargo.toml --features system-keystore,native-http --target-dir target/native-crypto --no-tests=pass ${{ runner.os == 'Windows' && '--test-threads 8' || '' }}
      - run: cargo test --locked --manifest-path crates/rv-crypto/Cargo.toml --features system-keystore,native-http --target-dir target/native-crypto --doc
      - name: Public vectors, verified independently with Node/OpenSSL
        if: runner.os == 'Linux'
        run: |
          for vector in archive group history history-backup file; do
            node "crates/rv-crypto-public/scripts/verify-$vector-vector.mjs"
          done
      - name: Mobile private bridge format, strict checks and lifetime tests
        run: |
          cargo fmt --manifest-path crates/rv-crypto-mobile/Cargo.toml -- --check
          cargo clippy --locked --manifest-path crates/rv-crypto-mobile/Cargo.toml --target-dir target/native-crypto --all-targets -- -D warnings
          cargo test --locked --manifest-path crates/rv-crypto-mobile/Cargo.toml --target-dir target/native-crypto --lib
      - run: cargo build --locked --manifest-path crates/rv-crypto/Cargo.toml --features system-keystore --target-dir target/native-crypto --example protected_smoke
      - name: Real Linux Secret Service, restart and forced process termination
        if: runner.os == 'Linux'
        env:
          RV_CRYPTO_SMOKE_BINARY: ${{ github.workspace }}/target/native-crypto/debug/examples/protected_smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnome-keyring dbus-daemon
          bash crates/rv-crypto/scripts/keystore-smoke.sh

  native-crypto-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vibez
          POSTGRES_PASSWORD: crypto-http-ci-disposable-password
          POSTGRES_DB: vibez
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vibez -d vibez"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://vibez:crypto-http-ci-disposable-password@localhost/vibez
      RV_CRYPTO_HTTP_SMOKE_BINARY: ${{ github.workspace }}/target/native-crypto/debug/examples/delivery_smoke
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/rv-crypto -> ../../target/native-crypto
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build the separate private HTTP worker fixture
        run: cargo build --locked --manifest-path crates/rv-crypto/Cargo.toml --features native-http --target-dir target/native-crypto --example delivery_smoke
      - name: Run the private worker against real HTTP and PostgreSQL
        run: cargo test --locked -p vibez --lib protected_http_worker_publishes_joins_rotates_and_reconciles_real_postgres -- --ignored --nocapture

  verify:
    needs: scope
    if: needs.scope.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vibez
          POSTGRES_PASSWORD: native-ci-disposable-password
          POSTGRES_DB: vibez
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vibez -d vibez"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://vibez:native-ci-disposable-password@localhost/vibez
      RV_CHECK_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vibez
          workspaces: |
            . -> target
            crates/rv-crypto -> ../../target
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.shard == '1/2' }}
      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Install the provider packages' workspace
        run: npm ci --no-audit --no-fund
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: bash apps/server/scripts/check.sh
      # The mobile typecheck and tests are mobile.yml's, on every branch.
      - name: Export Android JavaScript bundle
        if: matrix.shard == '2/2'
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir ../../artifacts/native-mobile-android

  server-binary:
    needs: scope
    if: needs.scope.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vibez
          workspaces: |
            . -> target
            crates/rv-crypto -> ../../target
          save-if: false
      - run: cargo build --locked -p vibez --config 'profile.dev.package.argon2.opt-level=3' --config 'profile.dev.package.blake2.opt-level=3'
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-native
          path: target/debug/vibez
          retention-days: 1

  native-desktop:
    needs: [scope, server-binary]
    if: needs.scope.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        leg: [widgets, core, factors]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install mobile provider dependencies for the integration peer
        if: matrix.leg != 'widgets'
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Install the provider packages' workspace
        if: matrix.leg != 'widgets'
        run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        id: native_desktop_fedora
        with:
          path: |
            .cache/native-desktop-cargo
            apps/desktop/target
          key: native-desktop-fedora-${{ hashFiles('apps/desktop/docker/Dockerfile') }}-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: |
            native-desktop-fedora-${{ hashFiles('apps/desktop/docker/Dockerfile') }}-
      - uses: docker/setup-buildx-action@v4
      - name: Load cached Fedora toolchain
        uses: docker/build-push-action@v7
        with:
          context: apps/desktop/docker
          load: true
          tags: rocket-vibe-rs-build
          cache-from: type=gha,scope=native-fedora-image
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,scope=native-fedora-image,mode=max,ignore-error=true' || '' }}
      - uses: actions/download-artifact@v4
        if: matrix.leg != 'widgets'
        with:
          name: vibez-native
          path: .cache/vibez-native
      - name: Disposable native server image
        if: matrix.leg != 'widgets'
        run: |
          chmod +x .cache/vibez-native/vibez
          docker build -t vibez-native-server -f apps/server/docker/Dockerfile.native .cache/vibez-native
      - name: Load cached native check toolchain
        if: matrix.leg != 'widgets'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/docker/Dockerfile.check
          load: true
          tags: vibez-native-check
          cache-from: type=gha,scope=native-check-image
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,scope=native-check-image,mode=max,ignore-error=true' || '' }}
      - name: Desktop GTK widget tests
        if: matrix.leg == 'widgets'
        run: |
          mkdir -p .cache/native-desktop-cargo artifacts
          docker run --rm -v "$PWD:/workspace" -v "$PWD/.cache/native-desktop-cargo:/cargo" \
            -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG \
            -w /workspace/apps/desktop rocket-vibe-rs-build bash -ec '
              # fmt, clippy and the workspace tests run in desktop.yml, on every branch.
              xvfb-run -a cargo test --locked -p rocket-vibe-gtk native_link_previews_paint -- --ignored --test-threads=1
              xvfb-run -a cargo test --locked -p rocket-vibe-gtk native_activity_uses_existing_join_and_info_buttons -- --ignored --test-threads=1
              xvfb-run -a cargo test --locked -p rocket-vibe-gtk native_group_review_uses_existing_controls_and_requires_confirmation -- --ignored --test-threads=1
              xvfb-run -a cargo test --locked -p rocket-vibe-gtk identity_settings_render_existing_preferences_and_clear_on_close -- --ignored --test-threads=1
              xvfb-run -a -s "-screen 0 1600x1000x24" cargo test --locked -p rocket-vibe-gtk categories_subpages_and_narrow_windows -- --ignored --test-threads=1
              xvfb-run -a -s "-screen 0 1600x1000x24" cargo test --locked -p rocket-vibe-gtk an_alert_over_the_dialog_closes_alone_on_its_backdrop_with_its_close_response -- --ignored --test-threads=1
              xvfb-run -a -s "-screen 0 1600x1000x24" cargo test --locked -p rocket-vibe-gtk incoming_calls_require_answers_and_keep_remote_and_account_closure -- --ignored --test-threads=1
              xvfb-run -a cargo test --locked -p rocket-vibe-gtk the_editor_and_the_form_card_follow_the_contract -- --ignored --test-threads=1
              xvfb-run -a cargo test --locked -p rocket-vibe-gtk new_direct_and_public_rooms_open_after_sync_without_stealing_later_navigation -- --ignored --test-threads=1
              xvfb-run -a -s "-screen 0 1600x1000x24" cargo test --locked -p rocket-vibe-gtk native_login_modes_fit_narrow_windows_and_scroll_to_their_submit -- --ignored --test-threads=1
              GSK_RENDERER=cairo xvfb-run -a cargo test --locked -p rocket-vibe-gtk windows_cairo_voice_to_room_keeps_zero_blur_speaking_and_button_feedback -- --ignored --test-threads=1
              xvfb-run -a cargo test --locked -p rocket-vibe-gtk control_and_a_digit_name_a_rail_position -- --ignored --test-threads=1
              cargo build --locked -p rocket-vibe-gtk
              timeout 30s bash scripts/check-notification-activation.sh
            '
      - name: Desktop pilot binaries
        if: matrix.leg != 'widgets'
        run: |
          mkdir -p .cache/native-desktop-cargo artifacts
          docker run --rm -v "$PWD:/workspace" -v "$PWD/.cache/native-desktop-cargo:/cargo" \
            -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG \
            -w /workspace/apps/desktop rocket-vibe-rs-build bash -ec '
              cargo build --locked -p rv-core --example native-smoke --example native-files-smoke --example native-reload-peer
              cargo build --locked -p rocket-vibe-gtk
            '
      - uses: actions/cache/save@v4
        if: matrix.leg == 'core' && github.ref == 'refs/heads/master' && steps.native_desktop_fedora.outputs.cache-hit != 'true'
        with:
          path: |
            .cache/native-desktop-cargo
            apps/desktop/target
          key: ${{ steps.native_desktop_fedora.outputs.cache-primary-key }}
      - name: Actual mobile SQLite runner and GTK desktop against PostgreSQL
        if: matrix.leg == 'core'
        run: |
          docker compose -f docker/compose.native-pilot.yml up -d postgres bootstrap server mobile factor-seed factor-proxy
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps desktop
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps factor-check
          test "$(docker inspect -f '{{.State.ExitCode}}' vibez-pilot-mobile-1)" = 0
          test "$(docker inspect -f '{{.State.Running}}' vibez-pilot-mobile-1)" = false
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps session-check
      - name: Existing GTK quote composer, native threads and unavailable cards
        if: matrix.leg == 'core'
        run: |
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps mobile node scripts/native-quotes-gtk-seed.ts
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps --user nobody desktop bash scripts/native-quotes-smoke.sh
      - name: GTK reload benchmark (a trend, not a gate)
        if: matrix.leg == 'core'
        run: |
          docker compose -f docker/compose.native-pilot.yml exec -T -e VIBEZ_USER_PASSWORD=native-pilot-test-password server             sh -c 'vibez create-user reload-gtk && vibez create-user reload-peer'
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps desktop bash scripts/native-reload-smoke.sh
          bash apps/desktop/scripts/native-reload-summary.sh artifacts/native-reload.log | tee -a "$GITHUB_STEP_SUMMARY"
          grep -qE 'native (reload|rooms) #' artifacts/native-reload.log || echo '::warning::the GTK reload benchmark traced no reload'
      - name: Native streamed files and existing GTK attachment controls
        if: matrix.leg == 'core'
        run: |
          docker compose -f docker/compose.native-files-pilot.yml up -d postgres bootstrap server
          docker compose -f docker/compose.native-files-pilot.yml exec -T server sh /src/apps/server/scripts/seed-test-emoji.sh
          docker compose -f docker/compose.native-files-pilot.yml run --rm --no-deps desktop
          docker compose -f docker/compose.native-files-pilot.yml run --rm --no-deps mobile-emojis
          docker compose -f docker/compose.native-files-pilot.yml run --rm --no-deps -e RV_SMOKE_NATIVE_EMOJIS=1 gtk
      - name: Existing GTK security settings and private receipt after restart
        if: matrix.leg == 'factors'
        run: |
          docker compose -p vibez-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml up -d factor-proxy
          docker compose -p vibez-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-desktop
          docker compose -p vibez-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-check
      - name: GTK email OTP login and identity proof across three real processes
        if: matrix.leg == 'factors'
        run: |
          docker compose -p vibez-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml up -d factor-proxy
          docker compose -p vibez-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml run --rm --no-deps otp-desktop
          docker compose -p vibez-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml run --rm --no-deps otp-check
      - name: GTK and mobile email profile receipts across three processes
        if: matrix.leg == 'factors'
        run: |
          files='-f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-email-settings-pilot.yml'
          docker compose -p vibez-email-settings-gtk $files up -d factor-proxy
          docker compose -p vibez-email-settings-gtk $files run --rm --no-deps email-settings-desktop
          docker compose -p vibez-email-settings-gtk $files run --rm --no-deps email-settings-check
          docker compose -p vibez-email-settings-mobile $files up -d factor-proxy
          docker compose -p vibez-email-settings-mobile $files run --rm --no-deps email-settings-mobile
          docker compose -p vibez-email-settings-mobile $files run --rm --no-deps email-settings-check
      - name: Integration logs and cleanup
        if: always()
        run: |
          docker compose -f docker/compose.native-files-pilot.yml logs --no-color > artifacts/native-files-pilot.log
          docker compose -f docker/compose.native-files-pilot.yml down -v -t 0
          docker compose -f docker/compose.native-pilot.yml logs --no-color > artifacts/native-pilot.log
          docker compose -f docker/compose.native-pilot.yml down -v -t 0
          docker compose -p vibez-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml logs --no-color > artifacts/native-security-pilot.log
          docker compose -p vibez-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml down -v -t 0
          docker compose -p vibez-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml logs --no-color > artifacts/native-email-otp-pilot.log
          docker compose -p vibez-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml down -v -t 0
          files='-f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-email-settings-pilot.yml'
          for project in vibez-email-settings-gtk vibez-email-settings-mobile; do
            docker compose -p "$project" $files logs --no-color > "artifacts/native-$project.log"
            docker compose -p "$project" $files down -v -t 0
          done
          # Docker's Rust compiler creates owner-only incremental lock files.
          # Return generated caches to the runner before actions/cache archives them.
          for path in .cache/native-desktop-cargo apps/desktop/target; do
            if [ -d "$path" ]; then sudo chown -R "$(id -u):$(id -g)" "$path"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-pilot-${{ matrix.leg }}
          path: artifacts/native-*
          if-no-files-found: error

  native-desktop-core-windows:
    needs: scope
    if: needs.scope.outputs.clients == 'true'
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo test --locked -p rv-core
      - name: Windows notification bridge and real COM process callback
        run: |
          cargo clippy --locked -p rv-native --all-targets -- -D warnings
          cargo test --locked -p rv-native

  native-swift-models:
    needs: [scope, server-binary]
    if: needs.scope.outputs.clients == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        id: native_swift_rust
        with:
          path: |
            .cache/native-swift-cargo
            apps/desktop/target/swift-linux
          key: native-swift-rust-v3-${{ hashFiles('apps/desktop/macos/docker/Dockerfile') }}-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/macos/Package.swift') }}
          restore-keys: |
            native-swift-rust-v3-${{ hashFiles('apps/desktop/macos/docker/Dockerfile') }}-
      - uses: actions/cache/restore@v4
        id: native_swift_objects
        with:
          path: apps/desktop/macos/.build/linux
          # Generated UniFFI records can change Swift layouts. Reuse compiled
          # objects only for the exact sources, without an older fallback.
          key: native-swift-objects-${{ hashFiles('Cargo.lock', 'apps/desktop/Cargo.lock', 'apps/desktop/macos/Package.swift', 'apps/desktop/macos/docker/Dockerfile', 'apps/desktop/macos/scripts/generate.sh', 'apps/desktop/crates/**/*.rs', 'crates/**/*.rs', 'apps/desktop/macos/Sources/**/*.swift', 'apps/desktop/macos/Tests/**/*.swift') }}
      - uses: docker/setup-buildx-action@v4
      - name: Load cached Swift toolchain
        uses: docker/build-push-action@v7
        with:
          context: apps/desktop/macos/docker
          load: true
          tags: rocket-vibe-swift
          cache-from: type=gha,scope=native-swift-image
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,scope=native-swift-image,mode=max,ignore-error=true' || '' }}
      - uses: actions/download-artifact@v4
        with:
          name: vibez-native
          path: .cache/vibez-native
      - name: Disposable native server image
        run: |
          chmod +x .cache/vibez-native/vibez
          docker build -t vibez-native-server -f apps/server/docker/Dockerfile.native .cache/vibez-native
      - name: Load cached native check toolchain
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/docker/Dockerfile.check
          load: true
          tags: vibez-native-check
          cache-from: type=gha,scope=native-check-image
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,scope=native-check-image,mode=max,ignore-error=true' || '' }}
      - name: Generate actual bindings and test shared view models
        run: |
          mkdir -p .cache/native-swift-cargo artifacts
          docker run --rm -v "$PWD:/workspace" -v "$PWD/.cache/native-swift-cargo:/cargo" \
            -w /workspace/apps/desktop -e CARGO_HOME=/cargo \
            -e CARGO_TARGET_DIR=/workspace/apps/desktop/target/swift-linux \
            -e CARGO_INCREMENTAL -e CARGO_PROFILE_DEV_DEBUG \
            -e CC=clang -e CXX=clang++ -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang \
            rocket-vibe-swift bash -ec '
              lib=$(macos/scripts/generate.sh | tail -1)
              cd macos
              export RV_FFI_LIB_DIR="$lib"
              swift build --scratch-path .build/linux
              swift test --scratch-path .build/linux
            '
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master' && steps.native_swift_rust.outputs.cache-hit != 'true'
        with:
          path: |
            .cache/native-swift-cargo
            apps/desktop/target/swift-linux
          key: ${{ steps.native_swift_rust.outputs.cache-primary-key }}
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/master' && steps.native_swift_objects.outputs.cache-hit != 'true'
        with:
          path: apps/desktop/macos/.build/linux
          key: ${{ steps.native_swift_objects.outputs.cache-primary-key }}
      - name: Swift models against PostgreSQL with real secure storage
        run: |
          docker compose -f docker/compose.native-pilot.yml up -d postgres bootstrap server factor-seed factor-proxy
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps swift
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps -e 'PGOPTIONS=-c vibez.pilot_factor_user=swift-factor' factor-check
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps session-check
      - name: Native files in existing Swift room and media models
        run: |
          docker compose -f docker/compose.native-files-pilot.yml up -d postgres bootstrap server
          docker compose -f docker/compose.native-files-pilot.yml exec -T server sh /src/apps/server/scripts/seed-test-emoji.sh
          docker compose -f docker/compose.native-files-pilot.yml run --rm --no-deps swift
      - name: Swift security settings and private receipt after process restart
        run: |
          docker compose -p vibez-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml up -d factor-proxy
          docker compose -p vibez-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-swift
          docker compose -p vibez-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-swift-check
      - name: Swift email OTP login and identity proof across three real processes
        run: |
          docker compose -p vibez-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml up -d factor-proxy
          docker compose -p vibez-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml run --rm --no-deps otp-swift
          docker compose -p vibez-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml run --rm --no-deps otp-swift-check
      - name: Swift email profile receipts across three real keyring processes
        run: |
          files='-f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml -f docker/compose.native-email-settings-pilot.yml'
          docker compose -p vibez-email-settings-swift $files up -d factor-proxy
          docker compose -p vibez-email-settings-swift $files run --rm --no-deps email-settings-swift
          docker compose -p vibez-email-settings-swift $files run --rm --no-deps -e 'PGOPTIONS=-c vibez.pilot_email_settings_user=swift-email' email-settings-check
      - name: Integration logs and cleanup
        if: always()
        run: |
          docker compose -f docker/compose.native-pilot.yml logs --no-color > artifacts/native-swift-pilot.log
          docker compose -f docker/compose.native-files-pilot.yml logs --no-color > artifacts/native-swift-files-pilot.log
          docker compose -f docker/compose.native-files-pilot.yml down -v -t 0
          docker compose -f docker/compose.native-pilot.yml down -v -t 0
          docker compose -p vibez-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml logs --no-color > artifacts/native-swift-security-pilot.log
          docker compose -p vibez-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml down -v -t 0
          docker compose -p vibez-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml logs --no-color > artifacts/native-swift-email-otp-pilot.log
          docker compose -p vibez-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml down -v -t 0
          files='-f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml -f docker/compose.native-email-settings-pilot.yml'
          docker compose -p vibez-email-settings-swift $files logs --no-color > artifacts/native-swift-email-settings.log
          docker compose -p vibez-email-settings-swift $files down -v -t 0
          # Swift's Docker compiler creates private ModuleCache/index directories.
          # Let the runner save its generated build cache after successful tests.
          for path in .cache/native-swift-cargo apps/desktop/target/swift-linux apps/desktop/macos/.build/linux; do
            if [ -d "$path" ]; then sudo chown -R "$(id -u):$(id -g)" "$path"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-swift-pilot
          path: artifacts/native-swift-*
