name: native-server

on:
  push:
    branches: [master, 'feature/rocketvibe-server']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/server/**'
      - 'crates/**'
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - 'docs/protocol/**'
      - 'docker/compose.rocketvibe.yml'
      - 'docker/compose.native-pilot.yml'
      - 'docker/compose.native-security-pilot.yml'
      - 'scripts/*native*'
      - 'scripts/inventory-rocketchat.mjs'
      - '.github/workflows/native-server.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/server/**'
      - 'crates/**'
      - 'apps/mobile/**'
      - 'apps/desktop/**'
      - 'docs/protocol/**'
      - 'docker/compose.native-pilot.yml'
      - 'docker/compose.native-security-pilot.yml'
      - 'scripts/*native*'
      - 'scripts/inventory-rocketchat.mjs'
      - '.github/workflows/native-server.yml'
  workflow_dispatch:

concurrency:
  group: native-server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: rocketvibe
          POSTGRES_PASSWORD: native-ci-disposable-password
          POSTGRES_DB: rocketvibe
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rocketvibe -d rocketvibe"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://rocketvibe:native-ci-disposable-password@localhost/rocketvibe
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-server-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - run: bash apps/server/scripts/check.sh
      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Mobile regression tests
        working-directory: apps/mobile
        run: npm test
      - name: Export Android JavaScript bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir ../../artifacts/native-mobile-android

  native-desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install mobile provider dependencies for the integration peer
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: |
            .cache/native-desktop-cargo
            apps/desktop/target
          key: native-desktop-fedora-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: native-desktop-fedora-
      - name: Build Fedora toolchain and disposable server images
        run: |
          docker build -t rocket-vibe-rs-build apps/desktop/docker
          docker build -t rocketvibe-native-server -f apps/server/Dockerfile .
          docker build -t rocketvibe-native-check -f apps/server/docker/Dockerfile.check .
      - name: Desktop workspace checks and pilot binaries
        run: |
          mkdir -p .cache/native-desktop-cargo artifacts
          docker run --rm -v "$PWD:/workspace" -v "$PWD/.cache/native-desktop-cargo:/cargo" \
            -w /workspace/apps/desktop rocket-vibe-rs-build bash -ec '
              cargo fmt --all -- --check
              cargo clippy --locked --workspace --all-targets -- -D warnings
              cargo test --locked --workspace
              cargo build --locked -p rv-core --example native-smoke
              cargo build --locked -p rocket-vibe-gtk
            '
      - name: Actual mobile SQLite runner and GTK desktop against PostgreSQL
        run: |
          docker compose -f docker/compose.native-pilot.yml up -d postgres bootstrap server mobile factor-seed factor-proxy
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps desktop
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps factor-check
          test "$(docker inspect -f '{{.State.ExitCode}}' rocketvibe-pilot-mobile-1)" = 0
          test "$(docker inspect -f '{{.State.Running}}' rocketvibe-pilot-mobile-1)" = false
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps session-check
      - name: Existing GTK security settings and private receipt after restart
        run: |
          docker compose -p rocketvibe-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml up -d factor-proxy
          docker compose -p rocketvibe-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-desktop
          docker compose -p rocketvibe-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-check
      - name: GTK email OTP login and identity proof across three real processes
        run: |
          docker compose -p rocketvibe-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml up -d factor-proxy
          docker compose -p rocketvibe-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml run --rm --no-deps otp-desktop
          docker compose -p rocketvibe-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml run --rm --no-deps otp-check
      - name: Integration logs and cleanup
        if: always()
        run: |
          docker compose -f docker/compose.native-pilot.yml logs --no-color > artifacts/native-pilot.log
          docker compose -f docker/compose.native-pilot.yml down -v
          docker compose -p rocketvibe-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml logs --no-color > artifacts/native-security-pilot.log
          docker compose -p rocketvibe-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml down -v
          docker compose -p rocketvibe-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml logs --no-color > artifacts/native-email-otp-pilot.log
          docker compose -p rocketvibe-gtk-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-desktop-pilot
          path: artifacts/native-*
          if-no-files-found: error

  native-desktop-core-windows:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            apps/desktop/target
          key: native-desktop-core-windows-${{ hashFiles('apps/desktop/Cargo.lock') }}
      - run: cargo test --locked -p rv-core

  native-swift-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            .cache/native-swift-cargo
            apps/desktop/target/swift-linux
            apps/desktop/macos/.build/linux
          key: native-swift-linux-${{ hashFiles('apps/desktop/Cargo.lock', 'apps/desktop/macos/Package.swift') }}
          restore-keys: native-swift-linux-
      - name: Build Swift toolchain and disposable native server
        run: |
          docker build -t rocket-vibe-swift apps/desktop/macos/docker
          docker build -t rocketvibe-native-server -f apps/server/Dockerfile .
          docker build -t rocketvibe-native-check -f apps/server/docker/Dockerfile.check .
      - name: Generate actual bindings and test shared view models
        run: |
          mkdir -p .cache/native-swift-cargo artifacts
          docker run --rm -v "$PWD:/workspace" -v "$PWD/.cache/native-swift-cargo:/cargo" \
            -w /workspace/apps/desktop -e CARGO_HOME=/cargo \
            -e CARGO_TARGET_DIR=/workspace/apps/desktop/target/swift-linux \
            -e CC=clang -e CXX=clang++ -e CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=clang \
            rocket-vibe-swift bash -ec '
              lib=$(macos/scripts/generate.sh | tail -1)
              cd macos
              export RV_FFI_LIB_DIR="$lib"
              swift build --scratch-path .build/linux
              swift test --scratch-path .build/linux
            '
      - name: Swift models against PostgreSQL with real secure storage
        run: |
          docker compose -f docker/compose.native-pilot.yml up -d postgres bootstrap server factor-seed factor-proxy
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps swift
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps -e 'PGOPTIONS=-c rocketvibe.pilot_factor_user=swift-factor' factor-check
          docker compose -f docker/compose.native-pilot.yml run --rm --no-deps session-check
      - name: Swift security settings and private receipt after process restart
        run: |
          docker compose -p rocketvibe-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml up -d factor-proxy
          docker compose -p rocketvibe-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-swift
          docker compose -p rocketvibe-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml run --rm --no-deps security-swift-check
      - name: Swift email OTP login and identity proof across three real processes
        run: |
          docker compose -p rocketvibe-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml up -d factor-proxy
          docker compose -p rocketvibe-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml run --rm --no-deps otp-swift
          docker compose -p rocketvibe-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml run --rm --no-deps otp-swift-check
      - name: Integration logs and cleanup
        if: always()
        run: |
          docker compose -f docker/compose.native-pilot.yml logs --no-color > artifacts/native-swift-pilot.log
          docker compose -f docker/compose.native-pilot.yml down -v
          docker compose -p rocketvibe-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml logs --no-color > artifacts/native-swift-security-pilot.log
          docker compose -p rocketvibe-swift-security-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml down -v
          docker compose -p rocketvibe-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml logs --no-color > artifacts/native-swift-email-otp-pilot.log
          docker compose -p rocketvibe-swift-email-otp-pilot -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml -f docker/compose.native-email-otp-pilot.yml -f docker/compose.native-swift-email-otp-pilot.yml down -v
          # Swift's Docker compiler creates private ModuleCache/index directories.
          # Let the runner save its generated build cache after successful tests.
          for path in .cache/native-swift-cargo apps/desktop/target/swift-linux apps/desktop/macos/.build/linux; do
            if [ -d "$path" ]; then sudo chown -R "$(id -u):$(id -g)" "$path"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-swift-pilot
          path: artifacts/native-swift-*
