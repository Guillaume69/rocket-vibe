# The provider crates below rv-core, each its own workspace and lock:
# rv-provider (what they share), then the providers built on it.
name: providers

on:
  push:
    branches: ['**']
    paths:
      - 'crates/rv-provider/**'
      - 'crates/rv-slack/**'
      - '.github/workflows/providers.yml'
  pull_request:
    paths:
      - 'crates/rv-provider/**'
      - 'crates/rv-slack/**'
      - '.github/workflows/providers.yml'
  workflow_dispatch:

concurrency:
  group: providers-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        crate: [rv-provider, rv-slack]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/${{ matrix.crate }}/target
          key: ${{ matrix.crate }}-${{ runner.os }}-${{ hashFiles(format('crates/{0}/Cargo.lock', matrix.crate)) }}
          restore-keys: ${{ matrix.crate }}-${{ runner.os }}-
      - run: cargo fmt --manifest-path crates/${{ matrix.crate }}/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/${{ matrix.crate }}/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path crates/${{ matrix.crate }}/Cargo.toml
