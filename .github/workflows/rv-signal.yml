name: rv-signal

on:
  push:
    branches: ['**']
    paths:
      - 'crates/rv-signal/**'
      - '.github/workflows/rv-signal.yml'
  pull_request:
    paths:
      - 'crates/rv-signal/**'
      - '.github/workflows/rv-signal.yml'
  workflow_dispatch:

concurrency:
  group: rv-signal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rv-signal -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --manifest-path crates/rv-signal/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/rv-signal/Cargo.toml --all-targets -- -D warnings
      # The interoperability tests need the clean-room oracle, never shipped:
      # they stay ignored here, and the recorded runs replay instead.
      - run: cargo test --locked --manifest-path crates/rv-signal/Cargo.toml
