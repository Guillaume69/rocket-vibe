name: rv-signal

on:
  push:
    branches: ['**']
    paths:
      - 'crates/rv-signal/**'
      - '.github/workflows/rv-signal.yml'
  pull_request:
    paths:
      - 'crates/rv-signal/**'
      - '.github/workflows/rv-signal.yml'
  workflow_dispatch:

concurrency:
  group: rv-signal-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/rv-signal/target
          key: rv-signal-${{ runner.os }}-${{ hashFiles('crates/rv-signal/Cargo.lock') }}
          restore-keys: rv-signal-${{ runner.os }}-
      - run: cargo fmt --manifest-path crates/rv-signal/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path crates/rv-signal/Cargo.toml --all-targets -- -D warnings
      # The interoperability tests need the clean-room oracle, never shipped:
      # they stay ignored here, and the recorded runs replay instead.
      - run: cargo test --locked --manifest-path crates/rv-signal/Cargo.toml
