name: rv-whatsapp

on:
  push:
    branches: ['**']
    paths:
      - 'crates/rv-whatsapp/**'
      - 'crates/rv-signal/**'
      - 'crates/rv-link-preview/**'
      - 'crates/rv-protocol/**'
      - '.github/workflows/rv-whatsapp.yml'
  pull_request:
    paths:
      - 'crates/rv-whatsapp/**'
      - 'crates/rv-signal/**'
      - 'crates/rv-link-preview/**'
      - 'crates/rv-protocol/**'
      - '.github/workflows/rv-whatsapp.yml'
  workflow_dispatch:

concurrency:
  group: rv-whatsapp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/rv-whatsapp
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/rv-whatsapp -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # Upstream's own files keep upstream's (nightly) formatting: only the
      # crates written here are held to rustfmt (VENDOR.md).
      - run: cargo fmt -p wacore-signal -p wacore-crypto -p wacore-appstate -p rv-whatsapp-engine --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
