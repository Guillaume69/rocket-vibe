name: server-image

# On demand only: builds the RocketVibe server image of an existing
# `vibez-vX.Y.Z` tag (apps/server/Dockerfile, the same build the release
# archive comes from, with the current Dockerfile's labels) and pushes it to
# ghcr.io as `X.Y.Z` and `latest`.
# server-release.yml already pushes it on each tag: this one backfills or
# republishes a version.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Server tag to publish (vibez-vX.Y.Z)
        required: true
      latest:
        description: Also move the latest tag
        type: boolean
        default: true

concurrency:
  group: server-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: The current Dockerfile, for its labels
        uses: actions/checkout@v5
        with:
          path: current
          sparse-checkout: apps/server/Dockerfile
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version=$(node scripts/version.mjs vibez --tag "$TAG")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          docker build -f apps/server/Dockerfile -t "vibez:$version" .
          # An older tag's Dockerfile may predate the labels: layer today's on top.
          { echo "FROM vibez:$version"; grep '^LABEL ' current/apps/server/Dockerfile; } \
            | docker build -t "vibez:$version" -
          docker image inspect "vibez:$version" \
            --format '{{ index .Config.Labels "org.opencontainers.image.description" }}' | grep .
      - name: Push to ghcr.io
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ inputs.latest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vibez"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "vibez:$VERSION" "$image:$VERSION"
          docker push "$image:$VERSION"
          if [ "$LATEST" = true ]; then
            docker tag "vibez:$VERSION" "$image:latest"
            docker push "$image:latest"
          fi
          echo "Pushed \`$image:$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
