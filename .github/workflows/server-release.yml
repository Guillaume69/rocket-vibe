name: server-release

# A `vibez-vX.Y.Z` tag publishes the Vibez server: the server gate, then
# one Docker build whose image goes to ghcr.io (`X.Y.Z` and `latest`) and whose
# binary becomes the Linux archive, then the GitHub Release with that version's
# changelog section.
# A release branch or a dispatch runs the same gate and packaging without
# publishing anything: the tag only lands on a flow already seen green.
on:
  push:
    tags: ['vibez-v*']
    branches: ['release/**']
  workflow_dispatch:

concurrency:
  group: server-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vibez
          POSTGRES_PASSWORD: native-ci-disposable-password
          POSTGRES_DB: vibez
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vibez -d vibez"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://vibez:native-ci-disposable-password@localhost/vibez
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: version
        name: Version, tag and changelog agree
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=$(node scripts/version.mjs vibez --tag "$GITHUB_REF_NAME")
          else
            version=$(node scripts/version.mjs vibez)
          fi
          node scripts/changelog.mjs vibez "$version" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vibez
          workspaces: |
            . -> target
            crates/rv-crypto -> ../../target
          save-if: false
      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: bash apps/server/scripts/check.sh

  package:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -f apps/server/Dockerfile -t "vibez:$VERSION" .
      - name: The image's binary as the Linux archive
        run: |
          mkdir -p dist package
          id=$(docker create "vibez:$VERSION")
          docker cp "$id:/usr/local/bin/vibez" package/vibez
          docker rm "$id"
          cp apps/server/README.md apps/server/CHANGELOG.md package/
          name="vibez-$VERSION-linux-x86_64"
          tar -C package -czf "dist/$name.tar.gz" vibez README.md CHANGELOG.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: server-package
          path: dist
          if-no-files-found: error
      - name: Push the image to ghcr.io
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vibez"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "vibez:$VERSION" "$image:$VERSION"
          docker tag "vibez:$VERSION" "$image:latest"
          docker push "$image:$VERSION"
          docker push "$image:latest"

  release:
    if: github.ref_type == 'tag'
    needs: [verify, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: server-package
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          node scripts/changelog.mjs vibez "$VERSION" > "$RUNNER_TEMP/notes.md"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vibez:$VERSION"
          printf '\n\nDocker image: `%s`\n' "$image" >> "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag \
            --title "Vibez $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
