name: web-client
on:
  push:
    branches: ['**']
    paths: ['apps/web/**', 'apps/server/**', 'crates/rv-protocol/**', 'crates/rv-crypto/**', 'crates/rv-crypto-mobile/**', 'crates/rv-crypto-public/**', 'crates/rv-link-preview/**', 'crates/rv-crypto-web/**', 'apps/mobile/providers/vibez/crypto*.ts', 'apps/mobile/providers/vibez/validation.ts', 'apps/mobile/providers/vibez/emojis.ts', 'apps/mobile/providers/vibez/emoji-aliases.generated.ts', 'apps/mobile/modules/crypto-native/index.ts', 'apps/desktop/crates/rv-gtk/src/style.rs', 'crates/rv-provider/data/emojis.tsv', 'apps/desktop/crates/rv-core/src/i18n.rs', 'apps/desktop/crates/rv-core/src/native/bots.rs', 'apps/desktop/crates/rv-core/src/native/workflows.rs', 'apps/desktop/crates/rv-gtk/assets/fonts/**', 'apps/desktop/crates/rv-gtk/src/login.rs', 'apps/mobile/providers/vibez/protocol.generated.ts', 'apps/desktop/data/**', 'assets/sounds/**', '.github/workflows/web-client.yml']
  pull_request:
    paths: ['apps/web/**', 'apps/server/**', 'crates/rv-protocol/**', 'crates/rv-crypto/**', 'crates/rv-crypto-mobile/**', 'crates/rv-crypto-public/**', 'crates/rv-link-preview/**', 'crates/rv-crypto-web/**', 'apps/mobile/providers/vibez/crypto*.ts', 'apps/mobile/providers/vibez/validation.ts', 'apps/mobile/providers/vibez/emojis.ts', 'apps/mobile/providers/vibez/emoji-aliases.generated.ts', 'apps/mobile/modules/crypto-native/index.ts', 'apps/desktop/crates/rv-gtk/src/style.rs', 'crates/rv-provider/data/emojis.tsv', 'apps/desktop/crates/rv-core/src/i18n.rs', 'apps/desktop/crates/rv-core/src/native/bots.rs', 'apps/desktop/crates/rv-core/src/native/workflows.rs', 'apps/desktop/crates/rv-gtk/assets/fonts/**', 'apps/desktop/crates/rv-gtk/src/login.rs', 'apps/mobile/providers/vibez/protocol.generated.ts', 'apps/desktop/data/**', 'assets/sounds/**', '.github/workflows/web-client.yml']
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
concurrency:
  group: web-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build and verify committed browser assets
        working-directory: apps/web
        run: |
          npm ci
          npm run crypto:build
          npm run format:check
          npm test
          npm run build
          git diff --exit-code -- dist src/gtk.css src/design.generated.ts src/third-party.generated.ts src/native-strings.generated.json src/native-errors.generated.json src/crypto

  # Built from the committed dist, which the assets job proves current. The
  # server's fmt, clippy and tests are native-server.yml's.
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: vibez
          workspaces: |
            . -> target
            crates/rv-crypto -> ../../target
          save-if: false
      - run: cargo build --locked -p vibez
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-debug
          path: target/debug/vibez
          retention-days: 1

  browser:
    needs: server
    strategy:
      fail-fast: false
      matrix:
        include:
          # Real sealed-history paging beyond 200 accepted MLS messages seeds 205
          # private sends through the UI: about an hour on a hosted runner.
          - shard: e2ee
            suites: e2ee
          - shard: rest
            suites: browser features media images video-reduce voice voice-connection voice-lifecycle incoming-call sessions locked composer conversation-parity gtk-forms emoji-completion admin-invitations shell-parity quiet receipts scheduled reminders threads global-search logout-replay notifications security security-pending factor-auth visual workflows reads profiles navigation social
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: web
          POSTGRES_PASSWORD: web-disposable-test-password
          POSTGRES_DB: web
        ports: ['55435:5432']
        options: >-
          --health-cmd "pg_isready -U web -d web"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://web:web-disposable-test-password@127.0.0.1:55435/web
      RV_WEB_TEST_URL: http://127.0.0.1:3417
      RV_WEB_SECURITY_USER: websecurity
      RV_WEB_PENDING_USER: websecpendingci
      RV_WEB_PENDING_EMAIL_USER: websecpendingemailci
      RV_WEB_FACTOR_USER: websecfactorci
      RV_WEB_FACTOR_EMAIL_USER: websecfactoremailci
      RV_WEB_COMPOSER_USER: webcomposer
      VIBEZ_USER_PASSWORD: web-client-disposable-password
      RV_WEB_CRYPTO_ALICE: webcryptoalice
      RV_WEB_CRYPTO_BOB: webcryptobob
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: vibez-debug
          path: target/debug
      - name: Browsers
        working-directory: apps/web
        run: |
          chmod +x ../../target/debug/vibez
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Start isolated SMTP, SFU and server
        run: |
          mkdir -p .cache/web-shots .cache/web-objects
          RV_WEB_SFU_IP="$(hostname -I | cut -d ' ' -f1)" node apps/web/tests/configure-bench.mjs
          node apps/web/tests/smtp.mjs > .cache/smtp.log 2>&1 &
          docker run -d --name rv-web-test-sfu --network host -v "$PWD/.cache/livekit.yaml:/etc/livekit.yaml:ro" livekit/livekit-server:v1.13.8 --config /etc/livekit.yaml
          export VIBEZ_AUTH_KEY_FILE="$PWD/.cache/auth-key"
          export VIBEZ_OBJECTS_DIR="$PWD/.cache/web-objects"
          export VIBEZ_SMTP_CONFIG_FILE="$PWD/.cache/smtp.json"
          export VIBEZ_LIVEKIT_CONFIG_FILE="$PWD/.cache/livekit.json"
          target/debug/vibez create-user webcryptoalice --admin
          target/debug/vibez create-user webcryptobob --admin
          target/debug/vibez create-user webalice --admin
          target/debug/vibez create-user webshell
          target/debug/vibez create-user webvoicefailure
          target/debug/vibez create-user webconnection
          target/debug/vibez create-user webconnectionpeer
          target/debug/vibez create-user webvoicelifecycle
          target/debug/vibez create-user webvoicelifecyclepeer
          target/debug/vibez create-user webread
          target/debug/vibez create-user webreadpeer
          target/debug/vibez create-user webprofile
          target/debug/vibez create-user webprofilepeer
          target/debug/vibez create-user webreadowner --admin
          target/debug/vibez create-user webbob
          target/debug/vibez create-user websecurity
          target/debug/vibez create-user websecpendingci
          target/debug/vibez create-user websecpendingemailci
          target/debug/vibez create-user websecfactorci
          target/debug/vibez create-user websecfactoremailci
          target/debug/vibez create-user webcomposer --admin
          target/debug/vibez create-user webrail
          target/debug/vibez create-user webquiet
          target/debug/vibez create-user webreceipts
          target/debug/vibez create-user webreceiptspeer
          target/debug/vibez create-user webscheduled
          target/debug/vibez create-user webreminders
          target/debug/vibez create-user webglobalsearch
          target/debug/vibez create-user weblogoutreplay
          target/debug/vibez create-user webnotify
          target/debug/vibez create-user webnotifypeer
          target/debug/vibez create-user webthreads
          target/debug/vibez create-user webthreadspeer
          target/debug/vibez create-user webvisual --admin
          target/debug/vibez create-user webadminlayout --admin
          target/debug/vibez create-user webadminlayoutpeer
          target/debug/vibez create-user webgtkforms
          target/debug/vibez create-user webgtkformspeer
          target/debug/vibez create-user webincoming
          target/debug/vibez create-user webincomingpeer
          target/debug/vibez create-user webemojipreview
          target/debug/vibez create-user webemojipreviewadmin --admin
          target/debug/vibez create-user webworkflows --admin
          target/debug/vibez create-user socialweb --admin
          target/debug/vibez create-user webmedia --admin
          target/debug/vibez create-user webmediapeer --admin
          target/debug/vibez create-user webimage --admin
          target/debug/vibez create-user webimagepeer --admin
          target/debug/vibez create-user webvideo --admin
          target/debug/vibez create-user webvideopeer --admin
          target/debug/vibez serve --bind 127.0.0.1:3417 > .cache/web-server.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent "$RV_WEB_TEST_URL/.well-known/vibez" > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent "$RV_WEB_TEST_URL/.well-known/vibez" > /dev/null
      - name: Exercise real browser conversations and devices
        working-directory: apps/web
        env:
          RV_WEB_PENDING_PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Closed browser contexts leave five-minute snapshot leases. Release them
          # between suites on this disposable server. All suites also share localhost's
          # login budget; release that IP window only at the closed-suite boundary,
          # keeping every limit within each suite real.
          for suite in ${{ matrix.suites }}; do
            npm run "test:$suite"
            docker exec "${{ job.services.postgres.id }}" psql -U web -d web --set ON_ERROR_STOP=1 --command "DELETE FROM snapshot_heads; DELETE FROM login_windows WHERE key LIKE 'ip:%'"
          done
      - name: Exercise authenticated browser vault and concurrent workers
        if: matrix.shard == 'rest'
        working-directory: apps/web
        run: |
          RV_WEB_API_URL="$RV_WEB_TEST_URL" npm run dev -- --port 3418 > ../../.cache/web-crypto-vite.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3418 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:crypto-storage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-browser-evidence-${{ matrix.shard }}
          path: |
            .cache/web-shots
            artifacts/rail-presence
            .cache/web-server.log
          if-no-files-found: ignore
