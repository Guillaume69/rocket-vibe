[workspace]
resolver = "3"
members = ["crates/rv-core", "crates/rv-ffi", "crates/rv-gtk", "crates/rv-native", "crates/rv-voice-protocol"]
# The voice sidecar links libwebrtc: its own workspace, never built with these.
exclude = ["voice"]

[workspace.package]
edition = "2024"
version = "0.11.0"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
result_large_err = "allow"
