[package]
name = "rv-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

# A stand-in for the rv-voice sidecar, for tests/voice.rs: a bin target is
# built before integration tests run (CARGO_BIN_EXE_*), whatever the filter.
[[bin]]
name = "fake-voice-sidecar"
path = "tests/support/fake_voice_sidecar.rs"
test = false
doc = false

[dependencies]
aws-lc-rs = "1.18.1"
base64 = "0.22.1"
chrono = "0.4.45"
fastrand = "2.5.0"
getrandom = "0.3"
futures-util = "0.3.34"
gif = "0.13"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.45", default-features = false, features = ["aws_lc_rs"] }
rv-client = { path = "../../../../crates/rv-client" }
rv-crypto = { path = "../../../../crates/rv-crypto", features = ["native-http", "system-keystore"] }
rv-protocol = { path = "../../../../crates/rv-protocol" }
rv-voice-protocol = { path = "../rv-voice-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
zeroize = "1"

[dev-dependencies]
rv-crypto-public = { path = "../../../../crates/rv-crypto-public" }
tempfile = "3"
