[package]
name = "rv-ffi"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "rv_ffi"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

[dependencies]
chrono = "0.4.45"
rv-core = { path = "../rv-core" }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { version = "0.32.2", features = ["cli"] }
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "3.6"


[dev-dependencies]
futures = { version = "0.3.31", default-features = false, features = ["executor", "std"] }
