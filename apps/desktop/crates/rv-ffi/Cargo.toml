[package]
name = "rv-ffi"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "rv_ffi"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"

[dependencies]
rv-crypto = { path = "../../../../crates/rv-crypto", features = ["system-keystore"] }
chrono = "0.4.45"
rv-core = { path = "../rv-core" }
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = { version = "0.32.2", features = ["cli"] }
url = "2.5.8"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
keyring = "3.6"


[dev-dependencies]
futures = { version = "0.3.31", default-features = false, features = ["executor", "std"] }
