[package]
name = "rv-native"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_TextServices",
    "Win32_UI_Notifications",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSDockTile",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSSet", "NSArray", "NSError", "NSObject", "NSBundle", "NSGeometry", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3", features = [
    "WKFrameInfo",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKSecurityOrigin",
    "WKUIDelegate",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKWindowFeatures",
    "block2",
    "objc2-app-kit",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "block2",
] }
