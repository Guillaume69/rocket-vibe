[package]
name = "rv-native"
edition.workspace = true
version.workspace = true
license.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSSet", "NSArray", "NSError", "NSObject", "NSBundle"] }
objc2-user-notifications = { version = "0.3", features = [
    "UNNotification",
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSettings",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
    "block2",
] }
