# The voice sidecar: the only binary that links libwebrtc (through LiveKit's
# prebuilt webrtc-sys). Its own workspace so that `cargo build --workspace` of
# apps/desktop, MSYS2 GTK included, never compiles webrtc-sys. See README.md.
[workspace]
resolver = "3"
# The screen's sound on Linux, apart from libwebrtc (screen-audio/Cargo.toml).
members = ["screen-audio"]

[package]
name = "rv-voice"
# Follows apps/desktop/Cargo.toml: one version per app.
version = "0.9.0"
edition = "2024"
license = "MIT"
publish = false

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
# `native` must be named: default-features = false also drops it, and without it
# livekit has no websocket/http client at all.
livekit = { version = "=0.9.3", default-features = false, features = ["native", "rustls-tls-native-roots"] }
rv-voice-protocol = { path = "../crates/rv-voice-protocol" }
futures-util = { version = "0.3", default-features = false }
serde_json = "=1.0.151"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
# The sidecar's own audio path (audio.rs): microphone and speakers, so that it
# can denoise, mix each person at their own volume and tell who speaks.
cpal = "=0.18.2"
# RNNoise in Rust (BSD-3-Clause): the noise remover, and its voice probability.
nnnoiseless = { version = "=0.5.2", default-features = false }

# PulseAudio's protocol in pure Rust (the `pulseaudio` crate), which PipeWire
# speaks too: cpal's PipeWire host would link libpipewire, whose symbols
# libwebrtc shadows with stubs (see screen-audio/), and ALSA names no sink.
[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "=0.18.2", features = ["pulseaudio"] }

# The camera: V4L2 on Linux, Media Foundation on Windows. No `decoding` feature,
# which would build mozjpeg's C sources: MJPEG frames go through `image`'s
# pure-Rust JPEG decoder. macOS has no camera here (its permission belongs to an
# app bundle the GTK build does not make).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# The screen's sound: WASAPI process loopback, everything but this process tree.
[target.'cfg(windows)'.dependencies]
wasapi = "0.25"
# A shared window's process, whose sound alone its share carries (wasapi's own version).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 4
