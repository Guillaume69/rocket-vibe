# Connexion (login simple, sans 2FA) : depuis un état VIERGE, saisir le
# serveur puis les identifiants, et atterrir sur la liste des salons.
appId: com.rocketvibe.app
---
- launchApp:
    clearState: true
# Build de DÉVELOPPEMENT : clearState renvoie sur le launcher expo-dev-client ;
# on tape l'entrée du serveur Metro (reconnue par son URL). En build release,
# ces lignes deviendraient inutiles.
- extendedWaitUntil:
    visible: 'Development Servers'
    timeout: 20000
- tapOn: 'http://.*:8081'
# Feuilles du dev-client au premier lancement : « Continue », puis le menu
# dev complet — chacune fermée si présente.
- tapOn:
    text: 'Continue'
    optional: true
- runFlow:
    when:
      visible: 'Fast Refresh'
    commands:
      - back
- extendedWaitUntil:
    visible: 'Adresse du serveur'
    timeout: 60000
# Le champ est PRÉ-REMPLI (SERVEUR_PAR_DEFAUT en dev) : effacer d'abord.
- tapOn:
    below: 'Adresse du serveur'
- eraseText
- inputText: '${SERVEUR}'
- tapOn: 'Continuer'
- extendedWaitUntil:
    visible: 'Identifiant ou email'
    timeout: 15000
- tapOn: 'jean.dupont'
- inputText: '${UTILISATEUR}'
- tapOn: '••••••••'
- inputText: '${MOT_DE_PASSE}'
- hideKeyboard
- tapOn: 'Se connecter'
# La liste des salons est l'écran d'accueil connecté.
- extendedWaitUntil:
    visible: 'Nouvelle conversation'
    timeout: 30000
- assertVisible: 'test-public'
