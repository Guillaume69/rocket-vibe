# Envoi : session existante, ouvrir test-public, envoyer un message unique,
# le voir rendu (l'aller-retour optimiste → serveur → SQLite → liste).
appId: com.rocketvibe.app
---
# `stopApp: false` : tuer et relancer un BUILD DEV recharge tout le bundle
# depuis Metro et retombe parfois sur le launcher du dev-client — inutile ici,
# la session du flow précédent est déjà au premier plan.
- launchApp:
    stopApp: false
# Si on est malgré tout sur le launcher du dev-client, on reprend la main.
- runFlow:
    when:
      visible: 'Development Servers'
    commands:
      - tapOn: 'http://.*:8081'
- extendedWaitUntil:
    visible: 'test-public'
    timeout: 30000
- tapOn: 'test-public'
- extendedWaitUntil:
    visible: 'Message'
    timeout: 15000
- tapOn: 'Message'
# Un brouillon restauré (8.7) peut occuper le champ : partir de zéro.
- eraseText
- inputText: '${MSG}'
- tapOn: 'Envoyer'
- hideKeyboard
- extendedWaitUntil:
    visible: '${MSG}'
    timeout: 15000
