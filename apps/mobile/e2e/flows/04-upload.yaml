# Upload : légende tapée AVANT le 📎 (elle part avec le fichier), sélection
# dans le picker système (le harnais a poussé ${FICHIER} dans Téléchargements),
# puis la légende apparaît en message — preuve que rooms.media + mediaConfirm
# ont abouti.
appId: com.rocketvibe.app
---
# `stopApp: false` : tuer et relancer un BUILD DEV recharge tout le bundle
# depuis Metro et retombe parfois sur le launcher du dev-client — inutile ici,
# la session du flow précédent est déjà au premier plan.
- launchApp:
    stopApp: false
# Si on est malgré tout sur le launcher du dev-client, on reprend la main.
- runFlow:
    when:
      visible: 'Development Servers'
    commands:
      - tapOn: 'http://.*:8081'
- extendedWaitUntil:
    visible: 'test-public'
    timeout: 30000
- tapOn: 'test-public'
- extendedWaitUntil:
    visible: 'Message'
    timeout: 15000
- tapOn: 'Message'
# Un brouillon restauré (8.7) peut occuper le champ : partir de zéro.
- eraseText
- inputText: '${LEGENDE}'
# PAS de hideKeyboard ici : sur Android il se traduit parfois par un BACK,
# qui sort de l'écran salon. Le 📎 reste visible clavier ouvert.
- tapOn: 'Joindre un fichier'
# Picker système (documentsui) : le fichier fraîchement poussé est visible
# dans « Récents ».
- extendedWaitUntil:
    visible: '${FICHIER}'
    timeout: 20000
- tapOn: '${FICHIER}'
# Retour dans l'app : compression + upload + confirm, puis le message-légende
# redescend par le stream — en scrollant : la barre du clavier peut couvrir
# le bas de la liste.
- scrollUntilVisible:
    element:
      text: '${LEGENDE}'
    direction: DOWN
    timeout: 60000
