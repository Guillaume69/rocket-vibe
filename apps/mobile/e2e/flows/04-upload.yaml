# Upload: caption typed BEFORE the 📎 (it goes out with the file), selection
# in the system picker (the harness pushed ${FILE} into Downloads), then
# the caption appears as a message: proof that rooms.media + mediaConfirm
# succeeded.
appId: com.rocketvibe.app
---
# `stopApp: false`: killing and relaunching a DEV BUILD reloads the whole
# bundle from Metro and sometimes lands back on the dev-client launcher;
# useless here, the previous flow's session is already in the foreground.
- launchApp:
    stopApp: false
# If we are on the dev-client launcher anyway, take back control.
- runFlow:
    when:
      visible: 'Development Servers'
    commands:
      - tapOn: 'http://.*:8081'
- extendedWaitUntil:
    visible: 'test-public'
    timeout: 30000
- tapOn: 'test-public'
- extendedWaitUntil:
    visible: 'Message'
    timeout: 15000
- tapOn: 'Message'
# A restored draft (8.7) may occupy the field: start from scratch.
- eraseText
- inputText: '${CAPTION}'
# NO hideKeyboard here: on Android it sometimes turns into a BACK, which
# leaves the room screen. The 📎 stays visible with the keyboard open.
- tapOn: 'Joindre un fichier'
# System picker (documentsui): the freshly pushed file is visible in
# "Recent".
- extendedWaitUntil:
    visible: '${FILE}'
    timeout: 20000
- tapOn: '${FILE}'
# Back in the app: compression + upload + confirm, then the caption message
# comes back down the stream; scrolling, since the keyboard bar may cover
# the bottom of the list.
- scrollUntilVisible:
    element:
      text: '${CAPTION}'
    direction: DOWN
    timeout: 60000
