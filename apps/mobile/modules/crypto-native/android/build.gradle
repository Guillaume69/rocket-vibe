plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.rocketvibe.crypto'
version = '0.1.0'

android {
  namespace 'com.rocketvibe.crypto'
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/rust')
  sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/jniLibs')
  // Preserve the generated JNA entry points when the application is minified.
  defaultConfig.consumerProguardFiles 'consumer-rules.pro'
}

dependencies {
  implementation 'net.java.dev.jna:jna:5.17.0@aar'
  androidTestImplementation 'androidx.test:runner:1.6.2'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}

def repository = file('../../../../..')
def requestedAbis = providers.gradleProperty('reactNativeArchitectures').orElse('arm64-v8a,x86_64')
def buildCrypto = tasks.register('buildCryptoNative', Exec) {
  workingDir repository
  inputs.files(fileTree(new File(repository, 'crates/rv-crypto-mobile')) { include '**/*.rs', '*.toml', 'Cargo.lock' })
  inputs.files(fileTree(new File(repository, 'crates/rv-crypto')) { include '**/*.rs', '*.toml', 'Cargo.lock' })
  inputs.files(fileTree(new File(repository, 'crates/rv-protocol')) { include '**/*.rs', '*.toml' })
  inputs.file file('../build-android.mjs')
  inputs.property 'abis', requestedAbis
  inputs.property 'minApi', android.defaultConfig.minSdkVersion.apiLevel
  outputs.dir layout.buildDirectory.dir('generated/rust')
  outputs.dir layout.buildDirectory.dir('generated/jniLibs')
  doFirst {
    commandLine 'node', file('../build-android.mjs').absolutePath,
      '--ndk', android.ndkDirectory.absolutePath,
      '--min-api', android.defaultConfig.minSdkVersion.apiLevel.toString(),
      '--abis', requestedAbis.get()
  }
}
tasks.named('preBuild').configure { dependsOn buildCrypto }
tasks.configureEach { task ->
  if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) task.dependsOn buildCrypto
}
