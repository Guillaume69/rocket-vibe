plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.rocketvibe.videocompressor'
version = '1.0.0'

android {
  namespace "com.rocketvibe.videocompressor"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // Media3 Transformer : le transcodeur officiel d'Android, sur MediaCodec
  // matériel — conforme à la règle « modules natifs par défaut, pas de
  // polyfill JS » (CLAUDE.md), et zéro dépendance JS tierce.
  implementation 'androidx.media3:media3-transformer:1.8.0'
  implementation 'androidx.media3:media3-effect:1.8.0'
  implementation 'androidx.media3:media3-common:1.8.0'
}
