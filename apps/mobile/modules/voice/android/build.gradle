plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.rocketvibe.voice'
version = '1.0.0'

// The voice sounds live once, at the repository root (assets/sounds, generated
// by scripts/sounds): copied here as raw resources, under Android-legal names.
def sounds = file("${projectDir}/../../../../../assets/sounds")
def generatedRes = layout.buildDirectory.dir('generated/voice-sounds/res').get().asFile
def copyVoiceSounds = tasks.register('copyVoiceSounds', Copy) {
  from(sounds) { include '*.ogg' }
  into(new File(generatedRes, 'raw'))
  rename { name -> name.replace('-', '_') }
}
android {
  namespace 'com.rocketvibe.voice'
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig { versionCode 1; versionName '1.0.0' }
  sourceSets { main { res.srcDirs += generatedRes } }
  sourceSets.main.jniLibs.srcDir layout.buildDirectory.dir('generated/jniLibs')
}
preBuild.dependsOn(copyVoiceSounds)

// The noise remover (crates/rv-voice-mobile, RNNoise in Rust), built as the
// crypto module builds its library.
def repository = file('../../../../..')
def requestedAbis = providers.gradleProperty('reactNativeArchitectures').orElse('arm64-v8a,x86_64')
def buildVoiceNative = tasks.register('buildVoiceNative', Exec) {
  workingDir repository
  inputs.files(fileTree(new File(repository, 'crates/rv-voice-mobile')) { include '**/*.rs', '*.toml', 'Cargo.lock' })
  inputs.file file('../build-android.mjs')
  inputs.property 'abis', requestedAbis
  inputs.property 'minApi', android.defaultConfig.minSdkVersion.apiLevel
  outputs.dir layout.buildDirectory.dir('generated/jniLibs')
  doFirst {
    commandLine 'node', file('../build-android.mjs').absolutePath,
      '--ndk', android.ndkDirectory.absolutePath,
      '--min-api', android.defaultConfig.minSdkVersion.apiLevel.toString(),
      '--abis', requestedAbis.get()
  }
}
tasks.named('preBuild').configure { dependsOn buildVoiceNative }
dependencies {
  implementation 'io.livekit:livekit-android:2.29.0'
}
