[package]
name = "rv-server"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm-siv = "0.11.1"
argon2 = "0.5.3"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
data-encoding = "2"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
scraper = { version = "0.24", default-features = false }
encoding_rs = "0.8"
url = "2"
rv-protocol = { path = "../../crates/rv-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
subtle = "2"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[dev-dependencies]
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rv-client = { path = "../../crates/rv-client" }
tokio-tungstenite = "0.28"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
