[package]
name = "rv-call"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Its own workspace: the voice sidecar (apps/desktop/voice) links it beside libwebrtc.
[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
quick-xml = "0.38"
# The TLS provider the voice sidecar already links through LiveKit.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
