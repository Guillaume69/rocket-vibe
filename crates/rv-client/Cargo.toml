[package]
name = "rv-client"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rv-protocol = { path = "../rv-protocol" }
serde = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[lints.rust]
unsafe_code = "forbid"
