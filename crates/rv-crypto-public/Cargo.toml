[package]
name = "rv-crypto-public"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
openmls = { version = "=0.9.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
