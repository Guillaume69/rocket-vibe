[package]
name = "rv-crypto-web"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rv-crypto = { path = "../rv-crypto" }
rv-crypto-mobile = { path = "../rv-crypto-mobile", default-features = false }
rv-protocol = { path = "../rv-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
js-sys = "0.3.106"
zeroize = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
