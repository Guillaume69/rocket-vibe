[package]
name = "rv-link-preview"
version = "0.1.0"
edition = "2024"
publish = false
description = "Link preview collector restricted to the public network, shared by the Vibez server and the WhatsApp engine"

[dependencies]
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rv-protocol = { path = "../rv-protocol" }
scraper = { version = "0.24", default-features = false }
tokio = { version = "1", features = ["net", "rt", "time"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
