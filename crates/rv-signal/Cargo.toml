[package]
name = "rv-signal"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The Signal protocol as WhatsApp speaks it, written from Signal's public specifications"

[workspace]

[dependencies]
aes = "0.9"
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
curve25519-dalek = { version = "5", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
hkdf = "0.13"
hmac = "0.13"
rand_core = "0.10"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2"
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
hex = "0.4"
rand = "0.10"
serde_json = "1"
