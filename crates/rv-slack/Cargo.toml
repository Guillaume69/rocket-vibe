[package]
name = "rv-slack"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
result_large_err = "allow"

[dependencies]
aws-lc-rs = "1.18.1"
base64 = "0.22.1"
chrono = "0.4.45"
futures-util = "0.3.34"
getrandom = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "multipart", "stream"] }
rv-provider = { path = "../rv-provider" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "fs", "io-util", "process"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
zeroize = "1"
