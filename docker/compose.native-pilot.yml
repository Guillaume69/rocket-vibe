# Disposable desktop/mobile integration bench; independent of the development database.
name: vibez-pilot
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: native-pilot-disposable-db-password
      POSTGRES_DB: pilot
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pilot -d pilot']
      interval: 2s
      timeout: 3s
      retries: 30
  bootstrap:
    image: vibez-native-server
    # Root is only used to initialize this disposable shared invitation volume.
    user: '0:0'
    volumes: ['pilot-invitations:/pilot-invitations']
    environment:
      DATABASE_URL: postgres://pilot:native-pilot-disposable-db-password@postgres/pilot
      VIBEZ_USER_PASSWORD: native-pilot-test-password
    entrypoint: [/bin/sh, -ec]
    command: ['umask 077; od -An -N32 -tx1 /dev/urandom | tr -d " \n" > /pilot-invitations/factors-auth-key; chown 10001:10001 /pilot-invitations/factors-auth-key; vibez create-user mobile && vibez create-user desktop && vibez create-user gtk-factor && vibez create-user gtk-security && vibez create-user swift-factor && vibez create-user swift-security && vibez create-user swift-replay && vibez invite > /pilot-invitations/mobile.json && vibez invite > /pilot-invitations/desktop.json && vibez invite > /pilot-invitations/swift.json && vibez create-user mobile-recovery && vibez create-user gtk-recovery && vibez create-user swift-recovery && vibez recover-user mobile-recovery > /pilot-invitations/mobile-recovery.json && vibez recover-user gtk-recovery > /pilot-invitations/desktop-recovery.json && vibez recover-user swift-recovery > /pilot-invitations/swift-recovery.json']
    depends_on:
      postgres: {condition: service_healthy}
  session-policy:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: native-pilot-disposable-db-password
    volumes: ['../scripts/native-session-pilot.sql:/pilot.sql:ro']
    command: [psql, -h, postgres, -U, pilot, -d, pilot, -v, ON_ERROR_STOP=1, -f, /pilot.sql]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  server:
    image: vibez-native-server
    environment:
      DATABASE_URL: postgres://pilot:native-pilot-disposable-db-password@postgres/pilot
      VIBEZ_BIND: 0.0.0.0:3400
      VIBEZ_AUTH_KEY_FILE: /pilot-invitations/factors-auth-key
    volumes: ['pilot-invitations:/pilot-invitations:ro']
    depends_on:
      session-policy: {condition: service_completed_successfully}
  factor-seed:
    image: vibez-native-check
    working_dir: /src
    volumes: ['..:/src', 'pilot-invitations:/pilot-invitations']
    environment:
      RV_PEER_URL: http://server:3400
      RV_PEER_PASSWORD: native-pilot-test-password
    command: [node, scripts/native-factors-pilot-seed.ts]
    depends_on: [server]
  factor-proxy:
    image: vibez-native-check
    working_dir: /src
    volumes: ['..:/src:ro']
    command: [node, scripts/native-factors-pilot-proxy.mjs]
    depends_on:
      factor-seed: {condition: service_completed_successfully}
  factor-check:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: native-pilot-disposable-db-password
      PGOPTIONS: -c vibez.pilot_factor_user=gtk-factor
    volumes: ['../scripts/native-factors-pilot-check.sql:/factors-check.sql:ro']
    command: [psql, -h, postgres, -U, pilot, -d, pilot, -v, ON_ERROR_STOP=1, -f, /factors-check.sql]
  session-check:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: native-pilot-disposable-db-password
    volumes: ['../scripts/native-session-pilot-check.sql:/pilot-check.sql:ro']
    command: [psql, -h, postgres, -U, pilot, -d, pilot, -v, ON_ERROR_STOP=1, -f, /pilot-check.sql]
    depends_on: [server]
  mobile:
    image: vibez-native-check
    working_dir: /src
    volumes: ['..:/src', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      RV_PEER_URL: http://server:3400
      RV_PEER_PASSWORD: native-pilot-test-password
      RV_NATIVE_INVITATION_FILE: /pilot-invitations/mobile.json
      RV_NATIVE_RECOVERY_FILE: /pilot-invitations/mobile-recovery.json
    command: [node, scripts/native-desktop-peer.ts]
    depends_on: [server]
  desktop:
    image: rocket-vibe-rs-build
    # Fedora's Secret Service daemon requires locked memory for its key material.
    cap_add: [IPC_LOCK]
    working_dir: /workspace/apps/desktop
    volumes: ['..:/workspace', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      HOME: /tmp/rv-native-pilot-home
      LANG: fr_FR.UTF-8
      LANGUAGE: fr
      RV_PEER_URL: http://server:3400
      RV_PEER_PASSWORD: native-pilot-test-password
      RV_NATIVE_INVITATION_FILE: /pilot-invitations/desktop.json
      RV_NATIVE_RECOVERY_FILE: /pilot-invitations/desktop-recovery.json
      RV_NATIVE_FACTOR_FILE: /pilot-invitations/gtk-factors.json
      RV_NATIVE_FACTOR_URL: http://factor-proxy:3401
    command: [bash, scripts/native-smoke.sh]
    depends_on: [mobile]
  swift:
    image: rocket-vibe-swift
    working_dir: /workspace/apps/desktop
    volumes: ['..:/workspace', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      RV_NATIVE_TEST_SERVER: http://server:3400
      RV_NATIVE_TEST_PASSWORD: native-pilot-test-password
      RV_NATIVE_TEST_INVITATION_FILE: /pilot-invitations/swift.json
      RV_NATIVE_TEST_RECOVERY_FILE: /pilot-invitations/swift-recovery.json
      RV_NATIVE_TEST_FACTOR_FILE: /pilot-invitations/swift-factors.json
      RV_NATIVE_TEST_FACTOR_URL: http://factor-proxy:3401
    command: [bash, macos/scripts/native-smoke.sh]
    depends_on: [server]

volumes:
  pilot-invitations:
