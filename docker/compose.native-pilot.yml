# Disposable desktop/mobile integration bench; independent of the development database.
name: rocketvibe-pilot
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pilot
      POSTGRES_PASSWORD: native-pilot-disposable-db-password
      POSTGRES_DB: pilot
    tmpfs: [/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pilot -d pilot']
      interval: 2s
      timeout: 3s
      retries: 30
  bootstrap:
    image: rocketvibe-native-server
    # Root is only used to initialize this disposable shared invitation volume.
    user: '0:0'
    volumes: ['pilot-invitations:/pilot-invitations']
    environment:
      DATABASE_URL: postgres://pilot:native-pilot-disposable-db-password@postgres/pilot
      RV_USER_PASSWORD: native-pilot-test-password
    entrypoint: [/bin/sh, -ec]
    command: ['umask 077; rv-server create-user mobile && rv-server create-user desktop && rv-server invite > /pilot-invitations/mobile.json && rv-server invite > /pilot-invitations/desktop.json && rv-server invite > /pilot-invitations/swift.json && rv-server create-user mobile-recovery && rv-server create-user gtk-recovery && rv-server create-user swift-recovery && rv-server recover-user mobile-recovery > /pilot-invitations/mobile-recovery.json && rv-server recover-user gtk-recovery > /pilot-invitations/desktop-recovery.json && rv-server recover-user swift-recovery > /pilot-invitations/swift-recovery.json']
    depends_on:
      postgres: {condition: service_healthy}
  session-policy:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: native-pilot-disposable-db-password
    volumes: ['../scripts/native-session-pilot.sql:/pilot.sql:ro']
    command: [psql, -h, postgres, -U, pilot, -d, pilot, -v, ON_ERROR_STOP=1, -f, /pilot.sql]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  server:
    image: rocketvibe-native-server
    environment:
      DATABASE_URL: postgres://pilot:native-pilot-disposable-db-password@postgres/pilot
      RV_BIND: 0.0.0.0:3400
    depends_on:
      session-policy: {condition: service_completed_successfully}
  session-check:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: native-pilot-disposable-db-password
    volumes: ['../scripts/native-session-pilot-check.sql:/pilot-check.sql:ro']
    command: [psql, -h, postgres, -U, pilot, -d, pilot, -v, ON_ERROR_STOP=1, -f, /pilot-check.sql]
    depends_on: [server]
  mobile:
    image: rocketvibe-native-check
    working_dir: /src
    volumes: ['..:/src', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      RV_PEER_URL: http://server:3400
      RV_PEER_PASSWORD: native-pilot-test-password
      RV_NATIVE_INVITATION_FILE: /pilot-invitations/mobile.json
      RV_NATIVE_RECOVERY_FILE: /pilot-invitations/mobile-recovery.json
    command: [node, scripts/native-desktop-peer.ts]
    depends_on: [server]
  desktop:
    image: rocket-vibe-rs-build
    # Fedora's Secret Service daemon requires locked memory for its key material.
    cap_add: [IPC_LOCK]
    working_dir: /workspace/apps/desktop
    volumes: ['..:/workspace', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      HOME: /tmp/rv-native-pilot-home
      LANG: fr_FR.UTF-8
      LANGUAGE: fr
      RV_PEER_URL: http://server:3400
      RV_PEER_PASSWORD: native-pilot-test-password
      RV_NATIVE_INVITATION_FILE: /pilot-invitations/desktop.json
      RV_NATIVE_RECOVERY_FILE: /pilot-invitations/desktop-recovery.json
    command: [bash, scripts/native-smoke.sh]
    depends_on: [mobile]
  swift:
    image: rocket-vibe-swift
    working_dir: /workspace/apps/desktop
    volumes: ['..:/workspace', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      RV_NATIVE_TEST_SERVER: http://server:3400
      RV_NATIVE_TEST_PASSWORD: native-pilot-test-password
      RV_NATIVE_TEST_INVITATION_FILE: /pilot-invitations/swift.json
      RV_NATIVE_TEST_RECOVERY_FILE: /pilot-invitations/swift-recovery.json
    command: [bash, macos/scripts/native-smoke.sh]
    depends_on: [server]

volumes:
  pilot-invitations:
