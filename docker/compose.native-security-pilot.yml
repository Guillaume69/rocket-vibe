# Overlay for a fresh project: compose -p rocketvibe-security-pilot
# -f docker/compose.native-pilot.yml -f docker/compose.native-security-pilot.yml
services:
  security-mail-config:
    image: rocketvibe-native-check
    working_dir: /src
    volumes: ['..:/src:ro', 'pilot-invitations:/pilot-invitations']
    command: [node, scripts/native-email-pilot-relay.mjs, configure]
    depends_on:
      bootstrap: {condition: service_completed_successfully}
  server:
    environment:
      RV_SMTP_CONFIG_FILE: /pilot-invitations/smtp-pilot.json
    volumes: ['../apps/server/tests/fixtures:/mail-fixtures:ro']
    depends_on:
      security-mail-config: {condition: service_completed_successfully}
  security-mail-relay:
    image: rocketvibe-native-check
    network_mode: 'service:server'
    working_dir: /src
    volumes: ['..:/src:ro', 'pilot-invitations:/pilot-invitations']
    command: [node, scripts/native-email-pilot-relay.mjs]
    depends_on: [server]
  security-policy:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: native-pilot-disposable-db-password
    volumes: ['../scripts/native-security-pilot-policy.sql:/security-policy.sql:ro']
    command: [psql, -h, postgres, -U, pilot, -d, pilot, -v, ON_ERROR_STOP=1, -f, /security-policy.sql]
    depends_on:
      session-policy: {condition: service_completed_successfully}
  factor-seed:
    environment:
      RV_PILOT_SECURITY: '1'
    depends_on:
      security-policy: {condition: service_completed_successfully}
  factor-proxy:
    environment:
      RV_PILOT_SECURITY: '1'
      RV_PILOT_EMAIL: '1'
    depends_on:
      security-mail-relay: {condition: service_started}
  security-desktop:
    image: rocket-vibe-rs-build
    cap_add: [IPC_LOCK]
    working_dir: /workspace/apps/desktop
    volumes: ['..:/workspace', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      HOME: /tmp/rv-native-security-home
      LANG: fr_FR.UTF-8
      LANGUAGE: fr
      RV_NATIVE_SECURITY_FACTOR_FILE: /pilot-invitations/gtk-security-factors.json
      RV_NATIVE_SECURITY_EMAIL_FILE: /pilot-invitations/gtk-security-mail.json
    command: [bash, scripts/native-security-smoke.sh]
    depends_on: [factor-proxy]
  security-check:
    image: postgres:18-alpine
    environment:
      PGPASSWORD: native-pilot-disposable-db-password
    volumes: ['../scripts/native-security-pilot-check.sql:/security-check.sql:ro']
    command: [psql, -h, postgres, -U, pilot, -d, pilot, -v, ON_ERROR_STOP=1, -f, /security-check.sql]
  security-swift:
    image: rocket-vibe-swift
    cap_add: [IPC_LOCK]
    working_dir: /workspace/apps/desktop
    volumes: ['..:/workspace', 'pilot-invitations:/pilot-invitations:ro']
    environment:
      RV_NATIVE_SECURITY_TEST_SERVER: http://factor-proxy:3401
      RV_NATIVE_SECURITY_TEST_PASSWORD: native-pilot-test-password
      RV_NATIVE_SECURITY_TEST_FACTOR_FILE: /pilot-invitations/swift-security-factors.json
      RV_NATIVE_SECURITY_TEST_EMAIL_FILE: /pilot-invitations/swift-security-mail.json
    command: [bash, macos/scripts/native-security-smoke.sh]
    depends_on: [factor-proxy]
  security-swift-check:
    extends: security-check
    environment:
      PGOPTIONS: -c rocketvibe.pilot_security_user=swift-security
