# Voice sessions for the native bench: a LiveKit SFU, layered over
# compose.rocketvibe.yml (docs/protocol/VOICE.md):
#
#   docker compose --env-file docker/.env.native -f docker/compose.rocketvibe.yml \
#     -f docker/compose.voice.yml up --build -d
#
# Phones and emulators reach LiveKit by RV_LIVEKIT_NODE_IP, the host's LAN
# address: 127.0.0.1 would point them at themselves.
services:
  livekit:
    image: livekit/livekit-server:v1.13.8
    command: ["--config", "/etc/livekit.yaml", "--node-ip", "${RV_LIVEKIT_NODE_IP:?Set RV_LIVEKIT_NODE_IP in docker/.env.native}"]
    environment:
      LIVEKIT_KEYS: "${RV_LIVEKIT_API_KEY:?Set RV_LIVEKIT_API_KEY}: ${RV_LIVEKIT_API_SECRET:?Set RV_LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
  # Writes the server's LiveKit configuration as a private file it owns.
  voice-config:
    image: busybox:1.37
    environment:
      URL: ${RV_LIVEKIT_URL:-ws://${RV_LIVEKIT_NODE_IP}:7880}
      KEY: ${RV_LIVEKIT_API_KEY}
      SECRET: ${RV_LIVEKIT_API_SECRET}
    command:
      - sh
      - -c
      - umask 077 && printf '{"url":"%s","api_url":"http://livekit:7880","api_key":"%s","api_secret":"%s"}' "$$URL" "$$KEY" "$$SECRET" > /config/livekit.json && chown 10001 /config/livekit.json
    volumes:
      - native-voice-config:/config
  server:
    environment:
      RV_LIVEKIT_CONFIG_FILE: /run/rocketvibe/livekit.json
    volumes:
      - native-voice-config:/run/rocketvibe:ro
    depends_on:
      voice-config:
        condition: service_completed_successfully
      livekit:
        condition: service_started
volumes:
  native-voice-config:
