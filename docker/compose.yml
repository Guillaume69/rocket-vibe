# Development Rocket.Chat server.
#
#   cd docker && cp .env.example .env && docker compose up -d
#
# Version pinned to 8.5.x, that of the target production server, not to the
# latest (8.6): API gaps between minors get paid for at the end of the road.
# 8.5 is an LTS supported until 2027-06-30.
name: rocket-vibe

services:
  mongodb:
    # `compatibleMongoVersions` of the 8.5.x release is exactly ["8.0"].
    # Checked on https://releases.rocket.chat/8.5.1/info
    image: mongodb/mongodb-community-server:${MONGODB_VERSION:-8.0-ubi8}
    # The replica set is required even with a single node: Rocket.Chat relies on
    # MongoDB change streams, which do not exist on a standalone mongod.
    #
    # Kernel >= 6.19: mongod 8.0.5+ REFUSES to start (SERVER-121912, tcmalloc
    # violated the rseq ABI rewritten in 6.19), with no possible override, neither
    # a parameter nor GLIBC_TUNABLES (tested). 8.0.4 is the last 8.0.x that
    # starts; RC 8.5 only requires ["8.0"]. Hence MONGODB_VERSION=8.0.4-ubi8
    # in .env on recent kernels.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # First pass: rs.status() throws NotYetInitialized, we initiate the
      # replica set and exit with failure to be run again. Next pass:
      # myState == 1 (PRIMARY) and the service becomes healthy. This is what
      # guarantees Rocket.Chat does not start on an uninitialized node.
      # We initiate ONLY on NotYetInitialized (code 94). A catch-all would
      # replay rs.initiate() on a transient error, so potentially on an
      # already formed replica set.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            if (rs.status().myState !== 1) quit(1);
          } catch (e) {
            if (e.code !== 94) { print('rs.status(): ' + e); quit(1); }
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] });
            quit(1);
          }
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  rocketchat:
    image: registry.rocket.chat/rocketchat/rocket.chat:${RC_VERSION:-8.5.1}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Bundle patched for push (see patch-push.mjs), named by version: after
      # a RC_VERSION change, startup fails until `node docker/patch-push.mjs`
      # has been run again.
      - type: bind
        source: ./patched/app-${RC_VERSION:-8.5.1}.js
        target: /app/bundle/programs/server/app/app.js
        read_only: true
        bind:
          create_host_path: false
    environment:
      # ROOT_URL carries the LAN IP, not 10.0.2.2: a physical device must reach
      # the server, and ROOT_URL shapes push payloads and deep links. For the
      # emulator: adb reverse tcp:3000 tcp:3000
      # `:?` makes `docker compose up` fail at once if the variable is missing,
      # instead of substituting an empty string. Meteor builds its absolute URLs
      # from ROOT_URL: an empty ROOT_URL gives silently broken notification
      # links and deep links.
      ROOT_URL: ${ROOT_URL:?ROOT_URL is required, copy docker/.env.example to docker/.env}
      PORT: 3000
      # No MONGO_OPLOG_URL: the variable was removed in 8.0.0, the server now
      # reads change streams.
      MONGO_URL: mongodb://mongodb:27017/rocketchat?replicaSet=rs0
      DEPLOY_METHOD: docker
      # Administrator created on the very first startup.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rocket-vibe.test}
      # Without a guard, an `up` run without .env would create the admin account
      # with an EMPTY password, on a server listening on the LAN IP.
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS is required, copy docker/.env.example to docker/.env}
      # The OVERWRITE_SETTING_ prefix forces the value on every startup. Here it
      # is needed: creating the admin through the ADMIN_* variables itself
      # writes Show_Setup_Wizard to "in_progress", and an unprefixed value
      # (applied only if the setting was never written) would come too late.
      # Without it, the admin UI stays stuck behind the setup wizard.
      #
      # We avoid OVERWRITE_SETTING_ for settings we want to toggle from the
      # admin during tests (2FA, Push_*, E2E): it would rewrite them on every
      # restart.
      OVERWRITE_SETTING_Show_Setup_Wizard: completed
    healthcheck:
      # The image defines no HEALTHCHECK and ships no curl; it ships node.
      test:
        - CMD
        - node
        - -e
        - |
          require('http')
            .get('http://127.0.0.1:3000/api/info', (r) => process.exit(r.statusCode === 200 ? 0 : 1))
            .on('error', () => process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  mongodb_data:
