# Reconnexion : le harnais a COUPÉ le lien (adb reverse retiré), bob a posté
# ${MSG} pendant la coupure, puis le lien est rétabli. Le message doit
# arriver par le rattrapage, sans action locale.
appId: com.rocketvibe.app
---
# `stopApp: false` : tuer et relancer un BUILD DEV recharge tout le bundle
# depuis Metro et retombe parfois sur le launcher du dev-client — inutile ici,
# la session du flow précédent est déjà au premier plan.
- launchApp:
    stopApp: false
# Si on est malgré tout sur le launcher du dev-client, on reprend la main.
- runFlow:
    when:
      visible: 'Development Servers'
    commands:
      - tapOn: 'http://.*:8081'
- extendedWaitUntil:
    visible: 'test-public'
    timeout: 30000
- tapOn: 'test-public'
# Large : backoff de reconnexion (jusqu'à 30 s) + rattrapage.
- extendedWaitUntil:
    visible: '${MSG}'
    timeout: 90000
